# VASEY.AUDIO production: nginx site template for a Forge-managed server. A PREPARATION TEMPLATE: nothing is deployed,
# no DNS record exists for it and no production host has been chosen (U-02 in docs/architecture/decision-register.md).
#
# Forked from ops/staging/nginx/vasey-staging.conf. What differs, and nothing else:
#   - no HTTP basic auth and no robots/noindex headers: the site is public and the application decides indexing;
#   - no unauthenticated /webhooks/stripe exemption: there is no production webhook receiver (VerifyStripeWebhook refuses
#     production), so a live one is a later reviewed change that must bring its own limits (1 MiB body, 60 s, POST only);
#   - the error log goes to stderr (the journal collects it); access logs are files, rotated by provision.sh's logrotate,
#     and mask the UUID in the two paid-delivery paths. nginx's error log still quotes the request line when an upstream
#     fails (observed), so treat the journal as sensitive: the identifiers are short-lived authorizations, not secrets at rest.
# Everything that carries the paid-delivery and upload contract is identical to staging: the dedicated FPM pool
# (/run/php/vasey-paid-delivery.sock), 480 s first-byte and 3,900 s whole-request read timeouts, response buffering on
# with a 1 GiB temp cap in a private 0700 directory, the 5 s connect timeout, 210 MiB Livewire uploads, 16 MiB elsewhere.
#
# Placeholders (replace every one; `grep -n '__[A-Z_]*__'` must print nothing afterwards):
#   __PRODUCTION_HOST__  the production hostname. Use a non-apex rehearsal name until DNS cutover is separately authorized.
#   __VASEY_ROOT__       the kit root that provision.sh creates (default /srv/vasey-production)
#   __SSL_CERT__         certificate path Forge wrote after Let's Encrypt (copy it from Forge's generated config)
#   __SSL_KEY__          key path Forge wrote after Let's Encrypt (copy it from Forge's generated config)
#   __FORGE_CONF__       the forge-conf directory name Forge uses for this site (copy the include lines exactly)
#
# Paste into Forge > Site > Edit Nginx Configuration, replacing the whole file. Keep Forge's `include forge-conf/...` lines:
# the `before/` include carries Forge's port-80 redirect and its Let's Encrypt challenge handling.
#
# Private storage is never reachable from here: the document root is current/public, there is no alias or storage location,
# private files stream through controllers (public/ holds only the Vite build), dotfiles answer 404 and no PHP file but
# index.php executes.
#
# Behind a CDN or proxy: do NOT put the paid-delivery paths behind a proxy whose read timeout is shorter than 3,900 s (see
# docs/ops/monitoring-and-host-baseline.md, "CDN and proxy"). The block below is deliberately commented out: trusting
# forwarded addresses needs the reviewed application change (trustProxies is not configured) and a reviewed address list.
#
# Sizes and timeouts come from the code:
#   - Livewire whole-file upload (`/livewire-<8 hex>/upload-file`): 200 MiB masters and stems ZIPs
#     (config/livewire.php max:204800, IngestMediaUpload), so 210m with multipart overhead.
#   - Resumable media and sound-kit uploads: 8 MiB chunks (ResumableMediaUploads::CHUNK_BYTES), so 16m elsewhere.
#   - Paid-delivery long routes: docs/ops/paid-delivery-runtime.md. Not mounted on main yet; until they are, these
#     locations reach Laravel and answer 404.

# ---- http-context helpers (Forge includes site files inside the http block) ----

limit_req_zone $binary_remote_addr zone=vasey_production_general:10m rate=30r/s;

# Add a header only when the application did not set its own. nginx appends after upstream headers, so an unconditional
# add_header would override stricter per-response choices (for example the app's `Referrer-Policy: no-referrer` on
# delivery and checkout responses). An empty value is not sent.
map $upstream_http_referrer_policy $vasey_production_referrer_policy {
    ""      "strict-origin-when-cross-origin";
    default "";
}
# Track embeds deliberately allow framing (PublicTrackEmbedResponse removes X-Frame-Options and sets frame-ancestors), so
# they never get one here; everything else is same-origin only. Matched on the original $request_uri: after `try_files`
# hands a route to /index.php, $uri is "/index.php" for every Laravel route.
map $request_uri $vasey_production_frame_options {
    ~^/embed/ "";
    default   "SAMEORIGIN";
}

# The authorization and origin identifiers in the paid-delivery paths are capabilities: keep them out of the access log
# (query strings on those two routes are dropped too).
map $request_uri $vasey_production_logged_uri {
    "~^(?<head>/paid-grants/(?:authorizations|origins)/)[0-9a-f-]{36}(?<tail>/(?:redeem|document))(?:\?.*)?$" "${head}:uuid${tail}";
    default $request_uri;
}
log_format vasey_production '$remote_addr [$time_iso8601] "$request_method $vasey_production_logged_uri" $status $body_bytes_sent '
                            'rt=$request_time "$http_user_agent"';

# Trusted-proxy handling is OFF. If, after the reviewed application change and a reviewed address list, the site sits
# behind a proxy that you control, nginx can restore the client address for rate limiting like this (illustration only):
#   set_real_ip_from <reviewed proxy address or range>;
#   real_ip_header CF-Connecting-IP;      # or X-Forwarded-For with real_ip_recursive on
# Do not enable it with an unreviewed or unbounded list: any client could then choose its own address.

include forge-conf/__FORGE_CONF__/before/*;

server {
    # `listen ... http2` works on nginx 1.24 (Ubuntu 24.04) and newer; 1.25.1+ also accepts `http2 on;`.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __PRODUCTION_HOST__;
    server_tokens off;

    root __VASEY_ROOT__/current/public;
    index index.php;
    charset utf-8;

    ssl_certificate __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:VaseyProductionSSL:10m;
    ssl_session_tickets off;

    limit_req zone=vasey_production_general burst=200 nodelay;
    limit_req_status 429;

    # Default request body cap: 8 MiB resumable chunks plus multipart overhead; 20 MiB artwork goes through the Livewire
    # upload location below.
    client_max_body_size 16m;
    client_body_timeout 120s;
    send_timeout 120s;

    # Every buffered FastCGI response (including paid deliveries of private masters) spools here, never in the distribution
    # default. provision.sh creates it 0700 for the nginx user. Never back it up or serve it.
    fastcgi_temp_path /var/lib/nginx/vasey-production-fastcgi 1 2;
    fastcgi_buffering on;
    fastcgi_max_temp_file_size 1024m;
    fastcgi_hide_header X-Powered-By;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy $vasey_production_referrer_policy always;
    add_header X-Frame-Options $vasey_production_frame_options always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), interest-cohort=()" always;

    include forge-conf/__FORGE_CONF__/server/*;

    # ---- Paid-delivery long routes (docs/ops/paid-delivery-runtime.md, requirements 1-4 and 7) ----
    # Regexes containing `{n}` must be quoted in nginx, or `{` opens a block (the runtime doc's reference snippet has this
    # mistake and fails `nginx -t`). Dedicated pool; the rest of the application keeps the short default pool. Short connect
    # timeout so an overloaded pool refuses quickly instead of queueing past the authorization lifetime.
    location ~ "^/paid-grants/authorizations/[0-9a-f-]{36}/redeem$" {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/vasey-paid-delivery.sock;
        fastcgi_connect_timeout 5s;
        fastcgi_read_timeout 480s;           # first byte: 60 + snapshot_seconds (300) + 60, plus margin
        fastcgi_buffering on;
        fastcgi_max_temp_file_size 1024m;    # >= largest deliverable (DeliveryAssetFiles::MAX_BYTES, 1 GiB)
        client_max_body_size 1m;
    }
    location ~ "^/paid-grants/origins/[0-9a-f-]{36}/document$" {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/vasey-paid-delivery.sock;
        fastcgi_connect_timeout 5s;
        fastcgi_read_timeout 3900s;          # application reference 300 + 300 + 10 x 300 + 60, not a measured guarantee: add the host's identity/queue/I/O margin (paid-delivery-runtime.md)
        client_max_body_size 1m;
    }

    # ---- Livewire whole-file upload: 200 MiB masters and stems ZIPs, 20 MiB artwork ----
    # The prefix is derived from APP_KEY (Livewire EndpointResolver), hence the pattern.
    location ~ "^/livewire-[0-9a-f]{8}/upload-file$" {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/vasey-production.sock;
        client_max_body_size 210m;
        client_body_timeout 300s;
        fastcgi_read_timeout 300s;
    }

    # Vite build output is content-hashed.
    location ^~ /build/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; try_files $uri =404; }

    # No dotfiles (.env, .git) and no other PHP entry points.
    location ~ /\.(?!well-known/) { return 404; }
    location ~ \.php$ { return 404; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/vasey-production.sock;
        fastcgi_read_timeout 300s;           # matches the default pool's request_terminate_timeout
    }

    access_log /var/log/nginx/vasey-production-access.log vasey_production;
    error_log  stderr error;

    error_page 404 /index.php;
}

include forge-conf/__FORGE_CONF__/after/*;
