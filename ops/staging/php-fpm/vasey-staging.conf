; VASEY.AUDIO staging: default PHP-FPM pool for every route except the two paid-delivery long routes.
; provision.sh renders the placeholders and installs this as /etc/php/8.4/fpm/pool.d/vasey-staging.conf.
;   __APP_USER__ / __APP_GROUP__     the one OS user that also runs the queue workers and owns private storage
;   __NGINX_USER__ / __NGINX_GROUP__ the user nginx workers run as (Forge: usually forge)
;   __VASEY_ROOT__                   kit root (default /srv/vasey-staging)
;
; Sized for an 8 GB server that also runs MySQL and clamscan (up to 3 GiB address space per scan).

[vasey-staging]
user = __APP_USER__
group = __APP_GROUP__
listen = /run/php/vasey-staging.sock
listen.owner = __NGINX_USER__
listen.group = __NGINX_GROUP__
listen.mode = 0660
listen.backlog = 128

pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500

; Longest legitimate default-pool request: a 200 MiB Livewire upload being hashed and moved, or a free-grant
; document render (60 s child bound). nginx's fastcgi_read_timeout for these locations is the same 300 s.
request_terminate_timeout = 300s
request_slowlog_timeout = 30s
slowlog = /var/log/php8.4-fpm-vasey-staging-slow.log
catch_workers_output = yes
decorate_workers_output = no

; Environment variables are not inherited; Laravel reads the release's .env (or the cached config).
clear_env = yes
env[PATH] = /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

; CPU-time limit (Linux max_execution_time does not count time blocked on I/O).
php_admin_value[max_execution_time] = 120
php_admin_value[max_input_time] = 300
php_admin_value[memory_limit] = 256M
; 200 MiB masters and stems ZIPs (config/livewire.php max:204800 and IngestMediaUpload), plus multipart overhead.
php_admin_value[upload_max_filesize] = 201M
php_admin_value[post_max_size] = 210M
php_admin_value[max_file_uploads] = 5
; Uploaded masters land in a private 0700 directory on the same filesystem as private storage, never /tmp.
php_admin_value[upload_tmp_dir] = __VASEY_ROOT__/tmp/php-upload
php_admin_value[sys_temp_dir] = __VASEY_ROOT__/tmp/php-sys
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php8.4-fpm-vasey-staging-error.log
php_admin_flag[allow_url_include] = off
php_admin_value[session.cookie_secure] = 1
php_admin_value[opcache.validate_timestamps] = 1
