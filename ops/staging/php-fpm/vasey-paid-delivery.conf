; VASEY.AUDIO staging: dedicated PHP-FPM pool for the two paid-delivery long routes.
; Binding source: docs/ops/paid-delivery-runtime.md (condition C11), requirements 1, 7 and 9.
;   POST /paid-grants/authorizations/{id}/redeem   whole request <= 7,620 s at the defaults
;   POST /paid-grants/origins/{batch}/document      whole request <= 3,660 s
; nginx sends only those two routes here (ops/staging/nginx/vasey-staging.conf). The routes are not mounted on
; main yet; this pool is scaffolding so they slot in. Re-derive request_terminate_timeout if
; config/paid-grants.php transfer_max_seconds or snapshot_seconds change (validated maxima need 16,320 s + margin).
;
; provision.sh renders the placeholders and installs this as /etc/php/8.4/fpm/pool.d/vasey-paid-delivery.conf.

[vasey-paid-delivery]
user = __APP_USER__
group = __APP_GROUP__
listen = /run/php/vasey-paid-delivery.sock
listen.owner = __NGINX_USER__
listen.group = __NGINX_GROUP__
listen.mode = 0660
; Requirement 7: bound the time a redeem can wait before PHP starts. A small backlog plus nginx's 5 s
; fastcgi_connect_timeout makes an overloaded pool refuse quickly instead of queueing past the lifetime.
listen.backlog = 8

; Three spool slots plus concurrent document requests (requirement 1). ondemand keeps idle memory at zero on a
; small staging server; switch to `pm = static` if spawn latency ever matters more than memory.
pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 60s
pm.max_requests = 50

; Requirement 1: at least the whole-request bound (7,620 s) plus margin. Never apply this to the default pool.
request_terminate_timeout = 7800s
request_slowlog_timeout = 600s
slowlog = /var/log/php8.4-fpm-vasey-paid-delivery-slow.log
catch_workers_output = yes
decorate_workers_output = no

clear_env = yes
env[PATH] = /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

; Requirement 1: hashing is CPU time, so no CPU-time cap in this pool; request_terminate_timeout bounds it.
php_admin_value[max_execution_time] = 0
php_admin_value[memory_limit] = 256M
php_admin_value[post_max_size] = 1M
php_admin_value[upload_max_filesize] = 1M
php_admin_value[sys_temp_dir] = __VASEY_ROOT__/tmp/php-sys
php_admin_value[upload_tmp_dir] = __VASEY_ROOT__/tmp/php-upload
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php8.4-fpm-vasey-paid-delivery-error.log
php_admin_flag[allow_url_include] = off
php_admin_value[session.cookie_secure] = 1
