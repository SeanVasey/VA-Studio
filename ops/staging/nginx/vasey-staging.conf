# VASEY.AUDIO private test-mode staging: nginx site body for a Forge-managed server (the inside of the site's server block).
#
# Placeholder (provision.sh renders it; `grep -n '__[A-Z_]*__'` must print nothing in the rendered file):
#   __VASEY_ROOT__     the kit root that provision.sh creates (default /srv/vasey-staging)
#
# Where it goes. Forge (Laravel VPS, nginx.org packages) generates /etc/nginx/sites-available/<host> as a wrapper:
#     include forge-conf/<id>/before/*;  include forge-conf/<id>/<host>/before/*;     (port-80 redirect server)
#     server { http2 on; listen 443 ssl; listen [::]:443 ssl; server_name <host>; server_tokens off;
#              root /home/forge/<host>; ssl_certificate ...; ssl_certificate_key ...;
#              include forge-conf/<id>/site.conf; }
#     include forge-conf/<id>/after/*;   include forge-conf/<id>/<host>/after/*;
# Forge's "Edit Nginx Configuration" and its site API (PUT .../sites/<site>/nginx) replace only forge-conf/<id>/site.conf.
# provision.sh renders this file to /etc/vasey-staging/nginx-site.conf: install it there, replacing the whole content.
# The wrapper owns listen, http2, server_name, server_tokens, the certificate and `root`, so none of them appear here
# (repeating one is a duplicate-directive error). The http-level helpers this file uses (`limit_req_zone`, `map`) are in
# nginx/vasey-staging-http.conf, which provision.sh installs as /etc/nginx/conf.d/vasey-staging.conf: it must be in place
# before this file is installed, because Forge writes site.conf without running `nginx -t`.
# For a host whose site file is edited as a whole, nginx/vasey-staging-classic.conf is a wrapper that includes this file.
#
# Document root. The wrapper's server-level `root` is the Forge git checkout (/home/forge/<host>), which must never be
# served. `root` cannot be repeated at server level, so EVERY location below sets `root __VASEY_ROOT__/current/public;`
# and `location /` catches every URI no other location matches: no request, internal redirect or error page resolves a
# file against the wrapper's root. Keep both properties when adding a location (tests/ops/test_staging_nginx_site.py).
# Forge's own `include forge-conf/<id>/server/*;` is deliberately not included: whatever Forge put there would inherit the
# checkout root and could repeat a directive set here.
#
# Access model: HTTP basic auth on everything. The one exception is exactly `POST /webhooks/stripe`,
# which the application authenticates by Stripe signature (VerifyStripeWebhook). Nothing else is
# reachable without the staging credentials.
#
# Sizes and timeouts come from the code:
#   - Livewire whole-file upload (`/livewire-<8 hex>/upload-file`): 200 MiB masters and stems ZIPs
#     (config/livewire.php max:204800, IngestMediaUpload), so 210m with multipart overhead.
#   - Resumable media and sound-kit uploads: 8 MiB chunks (ResumableMediaUploads::CHUNK_BYTES), so 16m elsewhere.
#   - Stripe webhook: 1 MiB (VerifyStripeWebhook::MAX_BODY_BYTES).
#   - Paid-delivery long routes: docs/ops/paid-delivery-runtime.md (dedicated FPM pool, per-route timeouts,
#     buffering, private temp path). Those routes are not mounted on main yet; until they are, these
#     locations reach Laravel and answer 404.

index index.php;
charset utf-8;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_timeout 1d;
ssl_session_cache shared:VaseyStagingSSL:10m;
ssl_session_tickets off;

# Private staging: every request needs the staging credentials unless a location below says otherwise.
auth_basic "VASEY.AUDIO staging";
auth_basic_user_file /etc/nginx/vasey-staging.htpasswd;

limit_req zone=vasey_staging_general burst=200 nodelay;
limit_req_status 429;

# Default request body cap: 8 MiB resumable chunks plus multipart overhead; 20 MiB artwork goes
# through the Livewire upload location below.
client_max_body_size 16m;
client_body_timeout 120s;
send_timeout 120s;

# Every buffered FastCGI response (including test deliveries of private masters) spools here, never in
# the distribution default. provision.sh creates it 0700 for the nginx user. Never back it up or serve it.
fastcgi_temp_path /var/lib/nginx/vasey-staging-fastcgi 1 2;
fastcgi_buffering on;
fastcgi_max_temp_file_size 1024m;
fastcgi_hide_header X-Powered-By;

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy $vasey_staging_referrer_policy always;
add_header X-Frame-Options $vasey_staging_frame_options always;
add_header X-Robots-Tag $vasey_staging_robots always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), interest-cohort=()" always;

# ---- Stripe test webhook: the only unauthenticated entry point ----
# Exact path match only: `/webhooks/stripe/`, `/index.php/webhooks/stripe` and every other URI stay
# behind basic auth. Methods other than POST are refused here (403). The FastCGI parameters are
# spelled out instead of including fastcgi_params so PHP always sees exactly this route: the raw
# request URI is not forwarded (nginx normalizes `..`, `//` and %-escapes for the match, Laravel would
# route on the raw form) and the query string is dropped.
location = /webhooks/stripe {
    root __VASEY_ROOT__/current/public;
    auth_basic off;
    limit_except POST { deny all; }
    limit_req zone=vasey_staging_webhook burst=40 nodelay;
    client_max_body_size 1m;

    fastcgi_pass unix:/run/php/vasey-staging.sock;
    fastcgi_param SCRIPT_FILENAME   $realpath_root/index.php;
    fastcgi_param SCRIPT_NAME       /index.php;
    fastcgi_param DOCUMENT_URI      /index.php;
    fastcgi_param DOCUMENT_ROOT     $realpath_root;
    fastcgi_param REQUEST_URI       /webhooks/stripe;
    fastcgi_param QUERY_STRING      "";
    fastcgi_param REQUEST_METHOD    $request_method;
    fastcgi_param CONTENT_TYPE      $content_type;
    fastcgi_param CONTENT_LENGTH    $content_length;
    fastcgi_param SERVER_PROTOCOL   $server_protocol;
    fastcgi_param REQUEST_SCHEME    $scheme;
    fastcgi_param HTTPS             $https if_not_empty;
    fastcgi_param GATEWAY_INTERFACE CGI/1.1;
    fastcgi_param SERVER_SOFTWARE   nginx;
    fastcgi_param REMOTE_ADDR       $remote_addr;
    fastcgi_param REMOTE_PORT       $remote_port;
    fastcgi_param SERVER_ADDR       $server_addr;
    fastcgi_param SERVER_PORT       $server_port;
    fastcgi_param SERVER_NAME       $server_name;
    fastcgi_param REDIRECT_STATUS   200;
    fastcgi_param HTTP_PROXY        "";
    # Keep signature admission explicit even if a Forge include disables request-header forwarding.
    fastcgi_param HTTP_STRIPE_SIGNATURE $http_stripe_signature;
    fastcgi_read_timeout 60s;
}

# ---- Paid-delivery long routes (docs/ops/paid-delivery-runtime.md, requirements 1-4 and 7) ----
# Regexes containing `{n}` must be quoted in nginx, or `{` opens a block (the runtime doc's reference
# snippet has this mistake and fails `nginx -t`).
# Dedicated pool; the rest of the application keeps the short default pool. Short connect timeout
# so an overloaded pool refuses quickly instead of queueing past the authorization lifetime.
location ~ "^/paid-grants/authorizations/[0-9a-f-]{36}/redeem$" {
    root __VASEY_ROOT__/current/public;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
    fastcgi_param HTTP_PROXY "";
    fastcgi_pass unix:/run/php/vasey-paid-delivery.sock;
    fastcgi_connect_timeout 5s;
    fastcgi_read_timeout 480s;           # first byte: 60 + snapshot_seconds (300) + 60, plus margin
    fastcgi_buffering on;
    fastcgi_max_temp_file_size 1024m;    # >= largest deliverable (DeliveryAssetFiles::MAX_BYTES, 1 GiB)
    client_max_body_size 1m;
}
location ~ "^/paid-grants/origins/[0-9a-f-]{36}/document$" {
    root __VASEY_ROOT__/current/public;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
    fastcgi_param HTTP_PROXY "";
    fastcgi_pass unix:/run/php/vasey-paid-delivery.sock;
    fastcgi_connect_timeout 5s;
    fastcgi_read_timeout 3900s;          # application reference 300 + 300 + 10 x 300 + 60, not a measured guarantee: add the host's identity/queue/I/O margin (paid-delivery-runtime.md)
    client_max_body_size 1m;
}

# ---- Livewire whole-file upload: 200 MiB masters and stems ZIPs, 20 MiB artwork ----
# The prefix is derived from APP_KEY (Livewire EndpointResolver), hence the pattern.
location ~ "^/livewire-[0-9a-f]{8}/upload-file$" {
    root __VASEY_ROOT__/current/public;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
    fastcgi_param HTTP_PROXY "";
    fastcgi_pass unix:/run/php/vasey-staging.sock;
    client_max_body_size 210m;
    client_body_timeout 300s;
    fastcgi_read_timeout 300s;
}

# Vite build output is content-hashed.
location ^~ /build/ {
    root __VASEY_ROOT__/current/public;
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    access_log off;
}

location = /favicon.ico { root __VASEY_ROOT__/current/public; access_log off; log_not_found off; try_files $uri =404; }

# No dotfiles (.env, .git) and no other PHP entry points.
location ~ /\.(?!well-known/) { root __VASEY_ROOT__/current/public; return 404; }
location ~ \.php$ { root __VASEY_ROOT__/current/public; return 404; }

# The catch-all: every URI starts with `/`, so a request that matches nothing above lands here, never on the wrapper's root.
location / {
    root __VASEY_ROOT__/current/public;
    try_files $uri $uri/ /index.php?$query_string;
}

location = /index.php {
    root __VASEY_ROOT__/current/public;
    internal;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
    fastcgi_param HTTP_PROXY "";
    fastcgi_pass unix:/run/php/vasey-staging.sock;
    fastcgi_read_timeout 300s;           # matches the default pool's request_terminate_timeout
}

access_log /var/log/nginx/vasey-staging-access.log;
error_log  /var/log/nginx/vasey-staging-error.log error;

error_page 404 /index.php;
