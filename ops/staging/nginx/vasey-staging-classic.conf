# VASEY.AUDIO private test-mode staging: whole-file nginx site for a host whose site file is edited as a whole
# (the older Forge layout, or a plain nginx host). Not needed on the current Forge layout, where Forge generates this
# wrapper itself and only its inside (site.conf) is edited: there, install /etc/vasey-staging/nginx-site.conf instead.
#
# provision.sh renders __STAGING_HOST__ and writes this file to /etc/vasey-staging/nginx-classic.conf. Then replace
# (`grep -n '__[A-Z_]*__'` must print nothing afterwards):
#   __SSL_CERT__       certificate path Forge wrote after Let's Encrypt (copy it from Forge's generated config)
#   __SSL_KEY__        key path Forge wrote after Let's Encrypt (copy it from Forge's generated config)
#   __FORGE_CONF__     the forge-conf directory name Forge uses for this site (copy the include lines exactly)
# and paste it as the whole site file. Keep Forge's `before/` include: it carries the port-80 redirect and the Let's
# Encrypt HTTP-01 challenge handling, so renewals keep working without basic auth.
#
# Everything else (basic auth, limits, headers, locations, each with its own root) is in the included site body, and its
# http-level helpers are in /etc/nginx/conf.d/vasey-staging.conf; provision.sh installs both and checks them with
# `nginx -t`. Re-running provision.sh updates the body in place; it takes effect on the next nginx reload.

include forge-conf/__FORGE_CONF__/before/*;

server {
    # `listen ... http2` works on nginx 1.24 (Ubuntu 24.04) and newer; 1.25.1+ also accepts `http2 on;`.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __STAGING_HOST__;
    server_tokens off;

    ssl_certificate __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;

    include /etc/vasey-staging/nginx-site.conf;
}

include forge-conf/__FORGE_CONF__/after/*;
