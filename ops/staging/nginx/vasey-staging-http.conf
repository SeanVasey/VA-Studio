# VASEY.AUDIO private test-mode staging: http-level nginx helpers for the site in nginx/vasey-staging.conf.
#
# provision.sh installs this file as /etc/nginx/conf.d/vasey-staging.conf. nginx.conf includes conf.d/*.conf at http level
# (Ubuntu's and nginx.org's packages both do, and Forge keeps it), before sites-enabled/*. Forge never writes here: its
# "Edit Nginx Configuration" and site API edit only the inside of the site's server block (forge-conf/<site id>/site.conf),
# where `limit_req_zone` and `map` are not allowed. No placeholders.
#
# Every name below is used by nginx/vasey-staging.conf and must be defined exactly once per nginx instance: a duplicate
# zone or map variable makes `nginx -t` fail. Do not paste these lines into the site as well. The production kit uses
# vasey_production_* names, so both kits can share one host.

# Requests per client address. The webhook zone is the only one an unauthenticated client can reach.
limit_req_zone $binary_remote_addr zone=vasey_staging_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=vasey_staging_webhook:1m rate=10r/s;

# Add a header only when the application did not set its own. nginx appends after upstream headers,
# so an unconditional add_header would override stricter per-response choices (for example the
# app's `Referrer-Policy: no-referrer` on delivery and checkout responses). An empty value is not sent.
map $upstream_http_referrer_policy $vasey_staging_referrer_policy {
    ""      "strict-origin-when-cross-origin";
    default "";
}
map $upstream_http_x_robots_tag $vasey_staging_robots {
    ""      "noindex, nofollow, noarchive";
    default "";
}
# Track embeds deliberately allow framing (PublicTrackEmbedResponse removes X-Frame-Options and sets
# frame-ancestors), so they never get one here; everything else is same-origin only. Matched on the original
# $request_uri: after `try_files` hands a route to /index.php, $uri is "/index.php" for every Laravel route.
map $request_uri $vasey_staging_frame_options {
    ~^/embed/ "";
    default   "SAMEORIGIN";
}
