; VASEY.AUDIO staging: queue workers and scheduler as supervisor programs.
; provision.sh renders the placeholders and installs this as /etc/supervisor/conf.d/vasey-staging.conf.
;   __APP_USER__   the one OS user shared with PHP-FPM; it owns storage/app/private (vasey:doctor expects 0700)
;   __PHP_BIN__    absolute PHP 8.4 CLI path (for example /usr/bin/php8.4), never a bare `php` that alternatives can repoint
;   __VASEY_ROOT__ kit root (default /srv/vasey-staging)
;
; Use these instead of Forge "Daemons": Forge names daemons by numeric id, and the deploy and backup
; quiesce steps need fixed names to stop, start and prove. Do not also add a Forge Scheduler entry; the
; scheduler program below replaces cron so the quiesce can stop it.
;
; Every program runs `current/artisan`. Supervisor chdirs into `current`, which resolves the symlink, so each
; process's /proc/<pid>/cwd is the exact release it started on (the deploy proves this after a switch).
;
; Queues in the code (config/queue.php, every ->onQueue() and dispatch):
;   media           ProcessMedia, ProcessSiteImage                      timeout 900 s, tries 3, failOnTimeout
;   payments        ProcessStripeReceiptJob, FinalizeTestPaymentJob     timeout 90 s, tries 1
;   contracts       IssueTestContractJob                                timeout 90 s, tries 1
;   default         ProcessSoundKit (900 s, tries 3), BuildDiscoverySitemapWindow (30 s, tries 3),
;                   RetrieveMembershipInvoice (tries 3), DeliverProductionIdentityNotice (tries 1)
;   inquiry-alerts  NotifyInquiryOperatorJob                            timeout 30 s, tries 1 (inquiries are off on staging)
; A job's own $timeout and $tries override the worker flags; the flags below are the fallback for jobs that set none.
; DB_QUEUE_RETRY_AFTER=1200 exceeds the longest job (900 s) and the media claim lease (960 s), so a job is never
; handed to a second worker while the first still runs it.
; stopwaitsecs exceeds each worker's longest job, so `supervisorctl stop` lets the current job finish (Laravel
; finishes the job on SIGTERM). A deploy or backup can therefore wait up to 16 minutes for a busy media worker.

[program:vasey-staging-media]
command=__PHP_BIN__ __VASEY_ROOT__/current/artisan queue:work database --queue=media --timeout=900 --tries=3 --sleep=1 --max-time=3600 --memory=256
directory=__VASEY_ROOT__/current
user=__APP_USER__
numprocs=1
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=960
killasgroup=true
stopasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/vasey-staging/worker-media.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

[program:vasey-staging-payments]
command=__PHP_BIN__ __VASEY_ROOT__/current/artisan queue:work database --queue=payments --timeout=90 --tries=1 --sleep=1 --max-time=3600 --memory=256
directory=__VASEY_ROOT__/current
user=__APP_USER__
numprocs=1
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=120
killasgroup=true
stopasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/vasey-staging/worker-payments.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

[program:vasey-staging-contracts]
command=__PHP_BIN__ __VASEY_ROOT__/current/artisan queue:work database --queue=contracts --timeout=90 --tries=1 --sleep=1 --max-time=3600 --memory=256
directory=__VASEY_ROOT__/current
user=__APP_USER__
numprocs=1
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=120
killasgroup=true
stopasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/vasey-staging/worker-contracts.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

; Kept apart from payments so a 900 s sound-kit job never delays a payment receipt.
[program:vasey-staging-default]
command=__PHP_BIN__ __VASEY_ROOT__/current/artisan queue:work database --queue=default,inquiry-alerts --timeout=120 --tries=1 --sleep=3 --max-time=3600 --memory=256
directory=__VASEY_ROOT__/current
user=__APP_USER__
numprocs=1
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=960
killasgroup=true
stopasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/vasey-staging/worker-default.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

; Laravel's scheduler (routes/console.php: vasey:publish-scheduled-site-release every minute). schedule:work runs
; schedule:run once a minute, so it equals the documented cron line while staying stoppable by the quiesce.
[program:vasey-staging-scheduler]
command=__PHP_BIN__ __VASEY_ROOT__/current/artisan schedule:work
directory=__VASEY_ROOT__/current
user=__APP_USER__
numprocs=1
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=120
killasgroup=true
stopasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/vasey-staging/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[group:vasey-staging]
programs=vasey-staging-media,vasey-staging-payments,vasey-staging-contracts,vasey-staging-default,vasey-staging-scheduler
