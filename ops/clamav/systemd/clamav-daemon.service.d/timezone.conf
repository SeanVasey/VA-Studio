# VASEY.AUDIO: give the clamd service a time zone of UTC.
#
# `clamdscan --version` prints the signature time in the daemon's time zone and the application reads it as UTC, so a
# daemon in Asia/Tokyo made it refuse fresh signatures as dated in the future, and one east of UTC makes it accept
# signatures older than its 48-hour limit without a word (docs/media-processing.md, "Time zone of clamd").
# Install as /etc/systemd/system/clamav-daemon.service.d/timezone.conf, then `systemctl daemon-reload` and restart
# clamav-daemon. This file is the drop-in that guide gives; the drop-in itself was not run on a systemd host.
[Service]
Environment=TZ=UTC
