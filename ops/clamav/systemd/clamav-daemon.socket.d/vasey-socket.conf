# VASEY.AUDIO: restrict the clamd socket to its owner and group.
#
# Ubuntu's clamav-daemon.socket sets SocketUser and SocketGroup to clamav and no SocketMode, so systemd's default of 0666
# applies and any local user could scan through the daemon (observed in the packaged unit on Ubuntu 24.04). With
# socket activation the socket unit, not clamd.conf, decides the mode. Only members of the group clamav (the media
# worker's user, added by install-clamd.sh) may use the daemon.
# Install as /etc/systemd/system/clamav-daemon.socket.d/vasey-socket.conf, then `systemctl daemon-reload` and restart
# clamav-daemon.socket. Check: `stat -c '%a %U:%G' /run/clamav/clamd.ctl` must print `660 clamav:clamav`.
[Socket]
SocketUser=clamav
SocketGroup=clamav
SocketMode=0660
