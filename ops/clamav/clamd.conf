# VASEY.AUDIO clamd profile
#
# Install as /etc/clamav/clamd.conf (ops/clamav/install-clamd.sh does it) for a host whose media worker uses
# MEDIA_CLAMSCAN=/usr/bin/clamdscan. Every value below comes from docs/media-processing.md, "Production malware scanner",
# and the numbers in it were measured with ClamAV 1.5.4 on Ubuntu 24.04. This is a complete file: Ubuntu's packaged
# clamd.conf must not be used as it is, because it fails open (MaxFileSize 25M, MaxScanSize 100M, MaxScanTime 120000, no
# AlertExceedsMax: an oversize file or a scan that outlasts the time limit is skipped and answered OK), disables the
# version command (the application then refuses every scan as scanner_signatures_stale) and opens the socket to everyone
# (LocalSocketMode 666).
#
# The first line of this file is the marker that provision.sh looks for before it stops a clamd it thinks is unused.
# Keep it.

# ---- Socket: only the worker may scan ----------------------------------------------------------------------------
# clamdscan looks here by default. The worker's user must be in the group `clamav` (usermod -aG clamav <worker user>)
# and the worker restarted, because a running process keeps the groups it started with. Under systemd socket
# activation (Ubuntu's clamav-daemon.socket) the socket is made by the socket unit, so its mode comes from the drop-in
# systemd/clamav-daemon.socket.d/vasey-socket.conf and not from these two lines; they apply when clamd makes the socket.
LocalSocket /run/clamav/clamd.ctl
LocalSocketGroup clamav
LocalSocketMode 660
FixStaleSocket true
User clamav

# ---- Size and time limits: the part that must not fail open ---------------------------------------------------------
# 1280M for both sizes. ClamAV counts an archive plus everything extracted from it against MaxScanSize, and the worker
# rebuilds every stems ZIP as a stored ZIP and scans that too, so the largest admitted archive (512 MiB expanded) needs
# its total twice; the application derives the figure in MalwareScanner::limitMebibytes(). Keep the two equal. If the
# application's bounds change, match these to the derived value.
MaxFileSize 1280M
MaxScanSize 1280M
# A file over a limit, or a scan that outlasts MaxScanTime, is reported as Heuristics.Limits.Exceeded (exit 1, so
# scan_not_clean) instead of being skipped. The application's canary refuses a daemon that does not do this.
AlertExceedsMax yes
# Milliseconds. Keeps the daemon's give-up time under the client's 300-second wall limit.
MaxScanTime 240000

# ---- Concurrency ------------------------------------------------------------------------------------------------------
# At least twice the number of media workers: clamd keeps scanning for a client that has gone (the application ends a
# clamdscan with SIGTERM then SIGKILL when a budget runs out), so a retry competes with the scan it replaces. The kit
# runs one media worker, so 2 is the floor; 4 leaves room for `vasey:doctor` and the acceptance checks. Each large archive
# adds about 250 MiB resident and can extract up to 1280 MiB under TemporaryDirectory. install-clamd.sh raises this to
# twice --media-workers when that is larger, and refuses a value below it.
MaxThreads 4
# A disk-backed directory the daemon owns (install-clamd.sh creates it). Disk needed: up to MaxThreads x 1280 MiB.
TemporaryDirectory /var/tmp/clamd

# ---- What the application reads from the daemon -----------------------------------------------------------------------
# The application reads the signature date from the daemon's version answer; Ubuntu packages it disabled.
EnableVersionCommand yes
# Scans keep running during a database reload, at the memory cost the host sizing note gives (peak about 2 GiB). Use
# `no` only on a host under 8 GB, accepting that a scan submitted during a reload waits for it.
ConcurrentDatabaseReload yes
# freshclam signals a reload after each update; this also notices a changed database on its own, every 10 minutes.
SelfCheck 600

# ---- Scanning: keep every engine on --------------------------------------------------------------------------------------
# The application does not check these. ScanArchive no passes the canary and the clean-file check yet reads OK for an
# EICAR member inside a ZIP, so acceptance step 3 of the guide (and install-clamd.sh --verify) must stay green.
ScanArchive yes
ScanPE yes
ScanELF yes
ScanMail yes
ScanHTML yes
ScanOLE2 yes
ScanPDF yes
ScanSWF yes
ScanXMLDOCS yes
ScanHWP3 yes
ScanOneNote yes
ScanImage yes
FollowDirectorySymlinks no
FollowFileSymlinks no
ExtendedDetectionInfo yes

# ---- Logging: syslog, so the journal collects it and the host's retention applies --------------------------------------
# No LogFile on purpose: nothing to rotate here. Signature updates are logged by freshclam (/var/log/clamav/freshclam.log,
# rotated by the packaged /etc/logrotate.d/clamav-freshclam).
LogSyslog yes
LogFacility LOG_DAEMON
LogClean no
LogVerbose no
