name: Dependency lock generation
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
jobs:
  resolve:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'work/dependency-pr-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Resolve reviewed npm upgrades on the supported Node runtime
        run: |
          npm pkg set 'engines.node=>=24.15.0 <25'
          npm install --save-dev --save-exact typescript@7.0.2 jsdom@30.0.1 @testing-library/jest-dom@7.0.1 vitest@5.0.0 @testing-library/dom@10.4.1 --package-lock-only --ignore-scripts
          npm audit --audit-level=high
      - name: Retain generated package evidence on this branch only
        run: |
          git diff --check
          git add -- package.json package-lock.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: resolve reviewed npm toolchain updates'
          git push origin HEAD:work/dependency-pr-integration
