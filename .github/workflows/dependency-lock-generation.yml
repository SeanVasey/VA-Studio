name: Dependency lock generation
on:
  pull_request:
    types: [opened]
permissions:
  contents: write
jobs:
  resolve:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'work/dependency-pr-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, bcmath, gd, zip, curl
          coverage: none
          tools: composer:v2
      - name: Resolve the five reviewed PHP upgrades with Composer
        run: >-
          composer update nunomaduro/collision:8.9.5 laravel/pao:1.1.5
          inertiajs/inertia-laravel:3.3.4 laravel/pint:1.32.1 filament/filament:5.8.1
          --with-all-dependencies --minimal-changes --no-install --no-scripts --no-plugins --no-interaction
      - run: composer validate --strict
      - run: composer audit --locked
      - name: Retain generated lock on this integration branch only
        run: |
          git diff --check
          git add -- composer.lock
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: resolve reviewed Composer dependency updates'
          git push origin HEAD:work/dependency-pr-integration
