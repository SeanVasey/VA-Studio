name: Isolated supplemental byte guard rollback feedback

# Informative exact-source feedback only; the final complete Foundation gate remains required.
on:
  push:
    branches: [codex/byte-guard-rollback-proof-20261001]

permissions:
  contents: read

concurrency:
  group: isolated-byte-guard-rollback-feedback
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  byte-guard-rollback-php:
    name: Supplemental byte guard rollback PHP feedback (${{ matrix.engine }})
    if: github.repository == 'VASEYDEV/VASEYAUDIO' && github.ref == 'refs/heads/codex/byte-guard-rollback-proof-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [sqlite, mysql]
    services:
      mysql:
        # The fixed workflow-owned engine enum is the only selector.
        image: ${{ matrix.engine == 'mysql' && 'mysql:8.4' || '' }}
        env:
          MYSQL_DATABASE: vaseyaudio_byte_guard_rollback_feedback
          MYSQL_ROOT_PASSWORD: ci-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: ${{ matrix.engine }}
      DB_DATABASE: ${{ matrix.engine == 'mysql' && 'vaseyaudio_byte_guard_rollback_feedback' || ':memory:' }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ci-only-password
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      CONTACT_INQUIRIES_ENABLED: 'false'
      CONTACT_INQUIRY_OPERATOR_NOTIFICATIONS_ENABLED: 'false'
      STRIPE_TEST_CHECKOUT_ENABLED: 'false'
      STRIPE_TEST_PAYMENT_PROCESSING_ENABLED: 'false'
      STRIPE_TEST_FINALIZATION_ENABLED: 'false'
      STRIPE_WEBHOOK_ENABLED: 'false'
      STRIPE_TEST_SECRET_KEY: ''
      STRIPE_WEBHOOK_SECRET: ''
      STRIPE_ACCOUNT_ID: ''
      VASEY_TEST_CONTRACT_ISSUANCE_ENABLED: 'false'
      VASEY_TEST_FULFILLMENT_ACTIVATION_ENABLED: 'false'
      VASEY_TEST_DELIVERY_ACCESS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Verify the exact parent and only the four reviewed source changes
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REPOSITORY" = VASEYDEV/VASEYAUDIO
          test "$GITHUB_REF" = refs/heads/codex/byte-guard-rollback-proof-20261001
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 190184bbcd4c644df7cccc76a9a5cd71f8c56956
          test "$(git rev-parse HEAD^^{tree})" = 4e0e72270195a7ac3701ef281e05a1764b401cc5
          git diff --exit-code HEAD --
          test -z "$(git ls-files --others --exclude-standard)"
          mkdir byte-guard-rollback-evidence
          python <<'PYTHON' 2>&1 | tee byte-guard-rollback-evidence/source-guard.log
          import hashlib, json, pathlib, subprocess
          hashes = {
              'database/migrations/2026_10_01_000029_byte_exact_hash_guards.php': 'ace2f1c4188e2ebfa3ade2f1033e1dc84ff31a47912cdffedf405ae3056a4ae6',
              'database/migrations/2026_10_01_000030_byte_exact_uuid_guards.php': '0f0fc0f306aebf987688d15d01eb07e0cdea1a211d8349e4f07b38b137e8cac4',
              'tests/Feature/HashByteGuardMigrationTest.php': 'dc9c45b065dfbd14c21866fe48aaa93604f9035afbf58edb02a9a7314ca64fbb',
              'tests/Feature/UuidByteGuardMigrationTest.php': '162d6f8aef4e4078e9bb363e26c6885140f7563d7ce6fcddd3db1671c67ec1e0',
          }
          expected = {('M', path) for path in hashes} | {('A', '.github/workflows/byte-guard-rollback-proof.yml')}
          actual = {tuple(line.split('\t')) for line in subprocess.check_output(
              ['git', 'diff', '--no-renames', '--name-status', 'HEAD^', 'HEAD'], text=True).splitlines()}
          if actual != expected:
              raise SystemExit('Unexpected supplemental byte guard proof source delta.')
          if any(hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest() != digest for path, digest in hashes.items()):
              raise SystemExit('Supplemental byte guard source does not match the reviewed correction.')
          print(json.dumps({'reviewedPermanentCommit': '266f81ba1b3e647c82d48421068384b53a3fdad5',
              'reviewedPermanentTree': 'e43fe2ff3ba54a3da3e5b83ef024c985968d332f', 'allowedSourceHashes': hashes}, sort_keys=True))
          PYTHON
          {
            git rev-parse HEAD HEAD^{tree} HEAD^ HEAD^^{tree}
            sha256sum .github/workflows/byte-guard-rollback-proof.yml composer.json composer.lock phpunit.xml scripts/ci/database-sqlite-skips.json database/migrations/2026_10_01_000029_byte_exact_hash_guards.php database/migrations/2026_10_01_000030_byte_exact_uuid_guards.php tests/Feature/HashByteGuardMigrationTest.php tests/Feature/UuidByteGuardMigrationTest.php tests/Support/FinalizationDatabaseMigrations.php tests/Support/DeliveryFixtures.php tests/Support/ContractFixtures.php tests/Support/PaymentFixtures.php
          } 2>&1 | tee byte-guard-rollback-evidence/source.log
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, bcmath, gd, zip, curl, posix
          coverage: none
          tools: composer:v2
      - name: Install the media and PDF prerequisites used by the original payment and delivery fixtures
        run: |
          set -euo pipefail
          {
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends ffmpeg util-linux qpdf poppler-utils
            test -x /usr/bin/ffmpeg
            test -x /usr/bin/ffprobe
            test -x /usr/bin/prlimit
          } 2>&1 | tee byte-guard-rollback-evidence/tools-install.log
      - name: Install only the locked backend dependencies
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist 2>&1 | tee byte-guard-rollback-evidence/composer-install.log
      - name: Prepare the isolated application environment
        run: |
          set -euo pipefail
          {
            cp .env.example .env
            php artisan key:generate
          } 2>&1 | tee byte-guard-rollback-evidence/application-setup.log
      - name: Record actual PHP, fixture tools and an empty supported database
        run: |
          set -euo pipefail
          {
            php --version
            php vendor/bin/phpunit --version
            composer --version
            ffmpeg -version
            ffprobe -version
            prlimit --version
            qpdf --version
            pdfinfo -v
            php <<'PHP'
          <?php
          if (getenv('DB_CONNECTION') === 'mysql') {
              $database = new PDO('mysql:host=127.0.0.1;port=3306;dbname=vaseyaudio_byte_guard_rollback_feedback', getenv('DB_USERNAME'), getenv('DB_PASSWORD'));
              $runtime = $database->query('SELECT VERSION() AS version, DATABASE() AS database_name, @@version_comment AS version_comment, @@sql_mode AS sql_mode, @@transaction_isolation AS transaction_isolation, @@lower_case_table_names AS lower_case_table_names')->fetch(PDO::FETCH_ASSOC);
              if (! str_starts_with($runtime['version'], '8.4.') || $runtime['database_name'] !== 'vaseyaudio_byte_guard_rollback_feedback'
                  || $runtime['transaction_isolation'] !== 'REPEATABLE-READ' || (int) $runtime['lower_case_table_names'] !== 0) {
                  throw new RuntimeException('Unexpected disposable MySQL runtime.');
              }
              $tables = (int) $database->query("SELECT COUNT(*) FROM information_schema.tables WHERE BINARY table_schema = 'vaseyaudio_byte_guard_rollback_feedback'")->fetchColumn();
          } elseif (getenv('DB_CONNECTION') === 'sqlite' && getenv('DB_DATABASE') === ':memory:') {
              $database = new PDO('sqlite::memory:');
              $runtime = ['version' => $database->query('SELECT sqlite_version()')->fetchColumn(), 'database_name' => ':memory:'];
              $tables = (int) $database->query("SELECT COUNT(*) FROM sqlite_master WHERE type = 'table'")->fetchColumn();
          } else {
              throw new RuntimeException('Unexpected fixed database selection.');
          }
          if ($tables !== 0) {
              throw new RuntimeException('The disposable database is not empty before tests.');
          }
          echo json_encode(['driver' => $database->getAttribute(PDO::ATTR_DRIVER_NAME), 'runtime' => $runtime, 'tables_before_tests' => $tables], JSON_THROW_ON_ERROR), PHP_EOL;
          PHP
          } 2>&1 | tee byte-guard-rollback-evidence/runtime.log
      - name: Check syntax of only the four reviewed PHP paths
        run: |
          set -euo pipefail
          {
            php --syntax-check database/migrations/2026_10_01_000029_byte_exact_hash_guards.php
            php --syntax-check database/migrations/2026_10_01_000030_byte_exact_uuid_guards.php
            php --syntax-check tests/Feature/HashByteGuardMigrationTest.php
            php --syntax-check tests/Feature/UuidByteGuardMigrationTest.php
          } 2>&1 | tee byte-guard-rollback-evidence/syntax.log
      - name: Discover the genuine cases from only the two fixed existing migration suites
        run: |
          set -euo pipefail
          php vendor/bin/phpunit tests/Feature/HashByteGuardMigrationTest.php tests/Feature/UuidByteGuardMigrationTest.php \
            --list-tests-xml=byte-guard-rollback-evidence/discovery.xml --fail-on-empty-test-suite --fail-on-phpunit-warning --display-warnings \
            2>&1 | tee byte-guard-rollback-evidence/discovery.log
      - name: Execute the two fixed suites once on the selected engine
        run: |
          set -euo pipefail
          php vendor/bin/phpunit tests/Feature/HashByteGuardMigrationTest.php tests/Feature/UuidByteGuardMigrationTest.php \
            --log-junit=byte-guard-rollback-evidence/results.xml \
            --fail-on-empty-test-suite --fail-on-phpunit-warning --fail-on-warning --fail-on-risky --fail-on-incomplete --fail-on-skipped --display-warnings \
            2>&1 | tee byte-guard-rollback-evidence/phpunit.log
      - name: Reconcile genuine discovery with every executed JUnit identity
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python <<'PYTHON' 2>&1 | tee byte-guard-rollback-evidence/census.log
          import collections, json, pathlib, re, xml.etree.ElementTree as ET
          fixed = {
              'Tests\\Feature\\HashByteGuardMigrationTest': 'tests/Feature/HashByteGuardMigrationTest.php',
              'Tests\\Feature\\UuidByteGuardMigrationTest': 'tests/Feature/UuidByteGuardMigrationTest.php',
          }
          expected = {class_name + '::' + method for class_name, file in fixed.items()
              for method in re.findall(r'^    public function (test_\w+)\(', pathlib.Path(file).read_text(), re.M)}
          namespace = {'p': 'https://xml.phpunit.de/testSuite'}
          discovery = ET.parse('byte-guard-rollback-evidence/discovery.xml').getroot()
          discovered = []
          for test_class in discovery.findall('p:tests/p:testClass', namespace):
              class_name = test_class.get('name')
              if class_name not in fixed or pathlib.Path(test_class.get('file', '')).resolve() != pathlib.Path(fixed[class_name]).resolve():
                  raise SystemExit('Unexpected discovery class or source path.')
              discovered.extend(method.get('id') for method in test_class.findall('p:testMethod', namespace))
          if len(discovered) != len(set(discovered)) or set(discovered) != expected:
              raise SystemExit('Discovery did not contain every fixed source identity exactly once.')
          result = ET.parse('byte-guard-rollback-evidence/results.xml').getroot()
          cases = result.findall('.//testcase')
          executed = []
          class_counts = collections.Counter()
          for case in cases:
              class_name = case.get('class')
              if class_name not in fixed or pathlib.Path(case.get('file', '')).resolve() != pathlib.Path(fixed[class_name]).resolve():
                  raise SystemExit('Unexpected JUnit class or source path.')
              executed.append(class_name + '::' + case.get('name', ''))
              class_counts[class_name] += 1
          if len(executed) != len(set(executed)) or set(executed) != set(discovered):
              raise SystemExit('Executed JUnit census differs from genuine discovery.')
          failures = sum(len(case.findall('failure')) for case in cases)
          errors = sum(len(case.findall('error')) for case in cases)
          skips = sum(len(case.findall('skipped')) for case in cases)
          record = {'discoveredCases': len(discovered), 'reportedCases': len(cases), 'executedCases': len(cases) - skips,
              'assertions': sum(int(case.get('assertions', '0')) for case in cases), 'failures': failures, 'errors': errors,
              'skips': skips, 'classCaseCounts': dict(class_counts), 'ids': sorted(executed)}
          pathlib.Path('byte-guard-rollback-evidence/census.json').write_text(json.dumps(record, indent=2, sort_keys=True) + '\n')
          print(json.dumps(record, sort_keys=True))
          if failures or errors or skips:
              raise SystemExit('The fixed byte guard selection did not execute every discovered identity successfully without skips.')
          PYTHON
      - name: Check formatting of the four reviewed PHP paths once
        if: ${{ !cancelled() && matrix.engine == 'sqlite' }}
        run: |
          set -euo pipefail
          php vendor/bin/pint --test -v database/migrations/2026_10_01_000029_byte_exact_hash_guards.php database/migrations/2026_10_01_000030_byte_exact_uuid_guards.php tests/Feature/HashByteGuardMigrationTest.php tests/Feature/UuidByteGuardMigrationTest.php \
            2>&1 | tee byte-guard-rollback-evidence/pint.log
      - name: Retain complete original source, discovery, runtime and result evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: byte-guard-rollback-${{ matrix.engine }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: byte-guard-rollback-evidence/
          retention-days: 7
          if-no-files-found: error
          overwrite: false
