# Informative formatting-only successor. Previous exact frontend, MySQL/SQLite and native results remain separately recorded.
name: Isolated operator sharing formatting feedback
'on':
  push:
    branches:
    - codex/operator-sharing-app-proof-20261001
permissions:
  contents: read
concurrency:
  group: isolated-operator-sharing-app-feedback
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  sharing-style:
    name: Operator sharing exact formatting feedback
    if: github.repository == 'VASEYDEV/VASEYAUDIO' && github.ref == 'refs/heads/codex/operator-sharing-app-proof-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ''
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      CONTACT_INQUIRIES_ENABLED: 'false'
      CONTACT_INQUIRY_OPERATOR_NOTIFICATIONS_ENABLED: 'false'
      STRIPE_TEST_CHECKOUT_ENABLED: 'false'
      STRIPE_TEST_PAYMENT_PROCESSING_ENABLED: 'false'
      STRIPE_TEST_FINALIZATION_ENABLED: 'false'
      STRIPE_WEBHOOK_ENABLED: 'false'
      STRIPE_TEST_SECRET_KEY: ''
      STRIPE_WEBHOOK_SECRET: ''
      STRIPE_ACCOUNT_ID: ''
      VASEY_TEST_CONTRACT_ISSUANCE_ENABLED: 'false'
      VASEY_TEST_FULFILLMENT_ACTIVATION_ENABLED: 'false'
      VASEY_TEST_DELIVERY_ACCESS_ENABLED: 'false'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 2
    - name: Record the exact formatting source
      run: "set -euo pipefail\ntest \"$GITHUB_EVENT_NAME\" = push\ntest \"$GITHUB_REPOSITORY\" = VASEYDEV/VASEYAUDIO\ntest\
        \ \"$GITHUB_REF\" = refs/heads/codex/operator-sharing-app-proof-20261001\ntest \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\"\
        \ngit diff --exit-code HEAD --\ntest -z \"$(git ls-files --others --exclude-standard)\"\nmkdir operator-sharing-app-evidence\n\
        {\n  git rev-parse HEAD HEAD^{tree}\n  sha256sum .github/workflows/operator-sharing-app-proof.yml composer.json composer.lock\
        \ phpunit.xml tests/Feature/ReadTrackSharingTest.php\n} 2>&1 | tee operator-sharing-app-evidence/php-source.log\n\n\
        test \"$(git rev-parse HEAD^)\" = bb1c04063cd29b02b979f6df7025c8e701815ef9\n"
    - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45
      with:
        php-version: '8.4'
        extensions: mbstring, intl, pdo_mysql, pdo_sqlite, bcmath, gd, zip, curl, posix
        coverage: none
        tools: composer:v2
    - name: Install the locked backend dependencies
      run: 'set -euo pipefail

        composer install --no-interaction --prefer-dist 2>&1 | tee operator-sharing-app-evidence/composer-install.log

        '
    - run: cp .env.example .env
    - run: php artisan key:generate
    - name: Verify PHP syntax and exact non-whitespace token equivalence
      run: "set -euo pipefail\nphp --version | tee operator-sharing-app-evidence/php-runtime.log\nphp --syntax-check tests/Feature/ReadTrackSharingTest.php\
        \ 2>&1 | tee operator-sharing-app-evidence/php-syntax.log\ngit show bb1c04063cd29b02b979f6df7025c8e701815ef9:tests/Feature/ReadTrackSharingTest.php\
        \ > operator-sharing-app-evidence/previous-sharing-test.php\nphp <<'PHP' 2>&1 | tee operator-sharing-app-evidence/php-token-equivalence.log\n\
        <?php\n$previous = file_get_contents('operator-sharing-app-evidence/previous-sharing-test.php');\n$current = file_get_contents('tests/Feature/ReadTrackSharingTest.php');\n\
        if (hash('sha256', $previous) !== 'e737716a3402ce8a588eddd9172d1971e872e21c0897c3a3fb77a138d077a753') {\n    throw\
        \ new RuntimeException('Unexpected original sharing test source.');\n}\nfunction semanticTokens(string $source): array\
        \ {\n    $result = [];\n    foreach (token_get_all($source, TOKEN_PARSE) as $token) {\n        if (is_array($token))\
        \ {\n            if ($token[0] === T_WHITESPACE) continue;\n            $result[] = [$token[0], $token[1]];\n    \
        \    } else {\n            $result[] = $token;\n        }\n    }\n    return $result;\n}\n$originalTokens = semanticTokens($previous);\n\
        $currentTokens = semanticTokens($current);\nif ($originalTokens !== $currentTokens) {\n    throw new RuntimeException('Sharing\
        \ test tokens changed beyond whitespace.');\n}\necho json_encode(['originalSourceSha256' => hash('sha256', $previous),\
        \ 'currentSourceSha256' => hash('sha256', $current),\n    'semanticTokensEqual' => true, 'tokenCount' => count($currentTokens),\n\
        \    'tokenSha256' => hash('sha256', json_encode($currentTokens, JSON_THROW_ON_ERROR))], JSON_THROW_ON_ERROR), PHP_EOL;\n\
        PHP\n"
    - name: Verify the exact sharing PHP formatting
      run: "set -euo pipefail\nphp vendor/bin/pint --test -v app/Domain/Catalog/ReadTrackSharing.php \\\n  app/Filament/Resources/TrackResource.php\
        \ tests/Feature/ReadTrackSharingTest.php \\\n  2>&1 | tee operator-sharing-app-evidence/pint.log\n"
    - name: Retain complete informative PHP evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: operator-sharing-format-${{ github.run_id }}-${{ github.run_attempt }}
        path: operator-sharing-app-evidence/
        retention-days: 7
        if-no-files-found: error
        overwrite: false
