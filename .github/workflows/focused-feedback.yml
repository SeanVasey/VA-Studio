name: Focused development feedback

# Deliberate focused feedback for development; success covers only the selected cases.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Reviewed test subset (not full merge acceptance)
        required: true
        type: choice
        default: unit
        options: [track-discovery, unit, media, commerce, financial, test-delivery, test-delivery-races, buyer-cancel, buyer-cancel-migrations, buyer-cancel-races, migration-recompilation, mysql-schema-snapshot, foundation-20261113-fixes, foundation-20261113-framework, legacy-fallbacks, phpunit13-name-clash, tc-lib-20261114, customer, operator, licensing, publication, track-concurrency, seller, store-foundations, membership-migrations, production-preparation, private-continuation, frontend, membership-history-frontend, browser-storefront, browser-offline, browser-customer, browser-site, browser-checkout, browser-delivery, browser-payment-exceptions, browser-operator-tracks, browser-operator-uploads, browser-operator-publication, bulk-license-browser, accessibility-browser]
      engine:
        description: PHP database engine; frontend/browser require sqlite
        required: true
        type: choice
        default: sqlite
        options: [sqlite, mysql]

permissions:
  contents: read

concurrency:
  group: focused-${{ github.ref }}-${{ inputs.suite }}-${{ inputs.engine }}
  cancel-in-progress: true

env:
  # Missing dispatch values remain empty and fail validation.
  FOCUSED_SUITE: ${{ inputs.suite }}
  FOCUSED_ENGINE: ${{ inputs.engine }}

jobs:
  focused-selection:
    name: Focused selection (informative)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      suite: ${{ steps.selection.outputs.suite }}
      engine: ${{ steps.selection.outputs.engine }}
      kind: ${{ steps.selection.outputs.kind }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify focused selector safeguards
        run: python3 scripts/ci/test-focused-tests.py
      - name: Validate selection and record actual source
        id: selection
        run: python3 scripts/ci/focused-tests.py --plan
      - name: Retain informative selection
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: focused-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: focused-ci-evidence.json
          retention-days: 7
          if-no-files-found: ignore

  focused-php:
    name: Focused PHP feedback (informative)
    needs: focused-selection
    if: needs.focused-selection.outputs.kind == 'php'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        # No MySQL container starts for SQLite. Only validated enum output selects it.
        image: ${{ needs.focused-selection.outputs.engine == 'mysql' && 'mysql:8.4' || '' }}
        env:
          MYSQL_DATABASE: vaseyaudio_focused
          MYSQL_ROOT_PASSWORD: ci-only-password
        ports:
          - 3306:3306
        # A disposable server: its data directory lives in memory (no disk syncs). Each test rebuilds the
        # schema with about 300 migrations, and on a disk-backed datadir every DDL commit synced to disk
        # (Foundation 43304362814: 85-100 s per MySQL test, 18 of 24 shards cancelled at 210 minutes).
        options: >-
          --tmpfs /var/lib/mysql:rw
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: ${{ needs.focused-selection.outputs.engine }}
      DB_DATABASE: ${{ needs.focused-selection.outputs.engine == 'mysql' && 'vaseyaudio_focused' || ':memory:' }}
      VA_CI_DISPOSABLE_MYSQL: ${{ needs.focused-selection.outputs.engine == 'mysql' && '1' || '' }}
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ci-only-password
      DB_URL: ''
      DB_SOCKET: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, bcmath, gd, zip, curl, fileinfo, dom, xml, xmlwriter, posix, pcntl
          ini-values: memory_limit=512M
          coverage: none
          tools: composer:v2
      - name: Verify bounded PHP test capabilities
        run: php scripts/ci/verify-php-test-runtime.php
      - name: Install media and PDF tools for feature subsets
        if: needs.focused-selection.outputs.suite != 'unit'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg util-linux qpdf poppler-utils
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      # The identity catalog admission binds the MySQL session to its exact TCP 4-tuple. The published port
      # (127.0.0.1:3306) is NAT: the server would see the bridge gateway and the client 127.0.0.1, so every
      # migrate:fresh refused. Reach the service container at its own bridge address, where both ends agree.
      - name: Address the MySQL service container directly and match its database collation
        if: needs.focused-selection.outputs.engine == 'mysql'
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: |
          [[ "$MYSQL_CONTAINER_ID" =~ ^[0-9a-f]{12,64}$ ]] || { echo "::error::missing MySQL service identity"; exit 1; }
          read -r -a addresses <<< "$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}' "$MYSQL_CONTAINER_ID")"
          [ "${#addresses[@]}" = 1 ] && [[ "${addresses[0]}" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]] \
            || { echo "::error::the MySQL service must have exactly one IPv4 bridge address"; exit 1; }
          # The image creates MYSQL_DATABASE with the server default utf8mb4_0900_ai_ci; staging and production
          # (provision.sh) create it utf8mb4_unicode_ci, which the account admission guard requires.
          docker exec -e MYSQL_PWD=ci-only-password "$MYSQL_CONTAINER_ID" \
            mysql -uroot -e 'ALTER DATABASE `vaseyaudio_focused` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          # Durability buys nothing on a disposable test server; locking, isolation and the native race behaviour
          # under test are unchanged. sync_binlog and the redo-log flush are dynamic; the receipts do not pin them.
          docker exec -e MYSQL_PWD=ci-only-password "$MYSQL_CONTAINER_ID" \
            mysql -uroot -e 'SET GLOBAL innodb_flush_log_at_trx_commit = 0; SET GLOBAL sync_binlog = 0'
          echo "DB_HOST=${addresses[0]}" >> "$GITHUB_ENV"
      - name: Run the selected PHP files and record outcomes
        run: python3 scripts/ci/focused-tests.py
      - name: Retain focused PHP evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: focused-php-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            focused-ci-*
            phpunit-focused.xml
          retention-days: 7
          if-no-files-found: ignore

  focused-frontend:
    name: Focused frontend feedback (informative)
    needs: focused-selection
    if: needs.focused-selection.outputs.kind == 'frontend'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Run frontend targets, build and scan the client bundle
        run: python3 scripts/ci/focused-tests.py
      - name: Retain focused frontend evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: focused-frontend-${{ github.run_id }}-${{ github.run_attempt }}
          path: focused-ci-*
          retention-days: 7
          if-no-files-found: ignore

  focused-browser:
    name: Focused browser feedback (informative)
    needs: focused-selection
    if: needs.focused-selection.outputs.kind == 'browser'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, bcmath, gd, zip, curl, fileinfo, dom, xml, xmlwriter, posix, pcntl
          ini-values: memory_limit=512M
          coverage: none
          tools: composer:v2
      - name: Verify bounded PHP test capabilities
        run: php scripts/ci/verify-php-test-runtime.php
      - name: Install genuine scanner and current official signatures for customer delivery fixtures
        run: bash tests/browser/install-related-scanner.sh
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Run core journey subset through the isolated browser wrapper
        run: python3 scripts/ci/focused-tests.py
      - name: Retain focused synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: focused-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            focused-ci-*
            test-results/
          retention-days: 7
          if-no-files-found: ignore
