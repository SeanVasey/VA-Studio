                        throw new RuntimeException('Unexpected worker import.');
                    }
                    $normalized = str_replace($declaration, '', $normalized);
                }
                $references = [
                    'InquiryAlertTransport::class' => '\\App\\Domain\\Inquiries\\Notifications\\InquiryAlertTransport::class',
                    'implements InquiryAlertTransport' => 'implements \\App\\Domain\\Inquiries\\Notifications\\InquiryAlertTransport',
                    'submit(OperatorInquiryAlert $alert)' => 'submit(\\App\\Domain\\Inquiries\\Notifications\\OperatorInquiryAlert $alert)',
                    'app(InquiryNotificationWork::class)' => 'app(\\App\\Domain\\Inquiries\\Notifications\\InquiryNotificationWork::class)',
                ];
                foreach ($references as $from => $to) {
                    if (substr_count($normalized, $from) !== 1) {
                        throw new RuntimeException('Unexpected worker reference.');
                    }
                    $normalized = str_replace($from, $to, $normalized);
                }
                $constructor = '            public function __construct(private string $directory) {}';
                if (substr_count($normalized, $constructor) !== 1) {
                    throw new RuntimeException('Unexpected worker constructor.');
                }
                $normalized = str_replace($constructor, '            public function __construct(private string $directory)'."\n            {\n            }", $normalized);
                if ($normalized !== $previous || strictTokens($normalized) !== $originalTokens) {
                    throw new RuntimeException('Worker changed beyond the exact reviewed class imports and formatting.');
                }
                strictTokens($current);
                $bridge = ['exactReviewedInverseEqual' => true, 'globalImports' => 3, 'classReferenceSites' => 4];
            }
            echo json_encode(['path' => $path, 'previousSourceSha256' => $previousHash, 'currentSourceSha256' => $currentHash] + $bridge, JSON_THROW_ON_ERROR), PHP_EOL;
        }
