        test "$GITHUB_REF" = refs/heads/codex/inquiry-mysql-profile-20261001
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        test "$(git rev-parse HEAD^)" = 47604d8ca165343950fb5716e49b3f93cd01527e
        test "$(git rev-parse HEAD^^)" = 6f499bdcec696320b2bef64f205c3a79c8fedf98
