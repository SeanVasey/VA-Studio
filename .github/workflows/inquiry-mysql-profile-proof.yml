            if hashlib.sha256(Path(path).read_bytes()).hexdigest() != expected:
                raise SystemExit('Reviewed application/test/policy source changed: ' + path)
        parent_workflow = subprocess.check_output(['git', 'show', 'HEAD^:.github/workflows/inquiry-format-proof.yml'])
        if hashlib.sha256(parent_workflow).hexdigest() != 'ae04d5ab3dc602b2ede4ced1483796d4661b3e69c44905849b03964c1a7d0aa6':
