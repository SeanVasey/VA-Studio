        if len(suites) != 1 or len(cases) != 34 or Counter(case.get('name') for case in cases) != Counter(expected_names):
            raise SystemExit('JUnit must record all exact 34 cases once.')
        if root.findall('.//failure') or root.findall('.//error') or root.findall('.//skipped'):
