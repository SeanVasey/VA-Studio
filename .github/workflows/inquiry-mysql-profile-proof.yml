# Temporary informative proof only; permanent Foundation gates remain required.
# The 90-minute bound follows an actual 45-minute cancellation, not a measured one-file duration.
name: Isolated inquiry notification migration MySQL progress
'on':
  push:
    branches:
    - codex/inquiry-mysql-profile-20261001
permissions:
  contents: read
concurrency:
  group: isolated-inquiry-mysql-profile
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  inquiry-mysql-profile:
    name: Inquiry notification migration MySQL named progress
    if: github.repository == 'VASEYDEV/VASEYAUDIO' && github.ref == 'refs/heads/codex/inquiry-mysql-profile-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: vaseyaudio_inquiry_migration_profile
          MYSQL_ROOT_PASSWORD: ci-only-password
        ports:
        - 3306:3306
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: mysql
      DB_DATABASE: vaseyaudio_inquiry_migration_profile
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ci-only-password
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      CONTACT_INQUIRIES_ENABLED: 'false'
      CONTACT_INQUIRY_OPERATOR_NOTIFICATIONS_ENABLED: 'false'
      STRIPE_TEST_CHECKOUT_ENABLED: 'false'
      STRIPE_TEST_PAYMENT_PROCESSING_ENABLED: 'false'
      STRIPE_TEST_FINALIZATION_ENABLED: 'false'
      STRIPE_WEBHOOK_ENABLED: 'false'
      STRIPE_TEST_SECRET_KEY: ''
      STRIPE_WEBHOOK_SECRET: ''
      STRIPE_ACCOUNT_ID: ''
