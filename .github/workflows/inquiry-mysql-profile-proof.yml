                raise SystemExit('JUnit selected a different class/file.')
            count = case.get('assertions', '')
            elapsed = float(case.get('time', 'nan'))
            if not count.isdigit() or int(count) < 1 or not math.isfinite(elapsed) or elapsed < 0:
                raise SystemExit('Each completed case needs assertions and finite timing.')
            assertions += int(count)
            case_receipts.append({'name': case.get('name'), 'assertions': int(count), 'seconds': elapsed})
        for attribute, required in [('tests', 34), ('errors', 0), ('failures', 0), ('skipped', 0), ('assertions', assertions)]:
            if suites[0].get(attribute) != str(required):
                raise SystemExit('JUnit aggregate is inconsistent: ' + attribute)
        plain = Path('inquiry-mysql-profile-evidence/events.log').read_text()
        verbose = Path('inquiry-mysql-profile-evidence/events-timing.log').read_text()
        event_times = {}
        for label in ['Test Preparation Started', 'Test Finished']:
            prefix = label + ' ('
            named = [line[len(prefix):-1] for line in plain.splitlines() if line.startswith(prefix) and line.endswith(')')]
            if Counter(named) != Counter(expected_ids):
                raise SystemExit('Named event census is incomplete or duplicated: ' + label)
            timed = []
            for line in verbose.splitlines():
                marker = ' ' + prefix
                if marker in line and line.endswith(')'):
                    timing, identity = line.split(marker, 1)
                    pattern = r'^\[(\d{2,}):(\d{2}):(\d{2})\.(\d{9}) / \d{2,}:\d{2}:\d{2}\.\d{9}\] \[\d+ bytes\]$'
                    match = re.fullmatch(pattern, timing)
                    if match is None:
                        raise SystemExit('Missing or malformed locked PHPUnit telemetry prefix.')
                    total = int(match[1]) * 3600 + int(match[2]) * 60 + int(match[3]) + int(match[4]) / 1_000_000_000
                    event_times[(label, identity[:-1])] = total
                    timed.append(identity[:-1])
            if Counter(timed) != Counter(expected_ids):
                raise SystemExit('Timed named event census is incomplete: ' + label)
        intervals = []
        for identity in sorted(expected_ids):
            start = event_times[('Test Preparation Started', identity)]
            finish = event_times[('Test Finished', identity)]
            if finish < start:
                raise SystemExit('A named test finished before preparation started.')
            intervals.append({'id': identity, 'start_seconds': start, 'finish_seconds': finish, 'elapsed_seconds': finish - start})
        receipt = {'cases': 34, 'assertions': assertions, 'failures': 0, 'errors': 0, 'skips': 0, 'discovery_identities': sorted(expected_ids), 'junit_case_timings': sorted(case_receipts, key=lambda case: case['name']), 'event_intervals': intervals, 'junit_sha256': hashlib.sha256(result_path.read_bytes()).hexdigest(), 'events_sha256': hashlib.sha256(plain.encode()).hexdigest(), 'timed_events_sha256': hashlib.sha256(verbose.encode()).hexdigest()}
        Path('inquiry-mysql-profile-evidence/runtime-receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
        print(json.dumps(receipt, sort_keys=True))
