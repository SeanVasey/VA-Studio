        ];
        function strictTokens(string $source): array
        {
            $result = [];
            foreach (token_get_all($source, TOKEN_PARSE) as $token) {
                if (is_array($token)) {
                    if ($token[0] === T_WHITESPACE) {
                        continue;
                    }
                    $result[] = [$token[0], $token[1]];
                } else {
                    $result[] = $token;
                }
            }

            return $result;
        }
        foreach ($expected as $path => [$previousHash, $currentHash]) {
            $previous = file_get_contents('inquiry-mysql-profile-evidence/previous-'.basename($path));
            $current = file_get_contents($path);
            if (hash('sha256', $previous) !== $previousHash || hash('sha256', $current) !== $currentHash) {
                throw new RuntimeException('Unexpected old/current formatting source for '.$path);
            }
            $originalTokens = strictTokens($previous);
            if ($path !== 'tests/Support/inquiry-notification-race-worker.php') {
                $currentTokens = strictTokens($current);
                if ($originalTokens !== $currentTokens) {
                    throw new RuntimeException('Non-whitespace PHP tokens changed for '.$path);
                }
                $bridge = ['nonWhitespaceTokensEqual' => true, 'tokenCount' => count($currentTokens)];
            } else {
                // This global script changes three imports/four name references, not only whitespace.
                $normalized = $current;
                foreach (['InquiryAlertTransport', 'InquiryNotificationWork', 'OperatorInquiryAlert'] as $alias) {
