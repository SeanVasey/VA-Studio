name: Foundation CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prove the changed-file scope
        id: classify
        run: python3 scripts/ci/ci-scope.py classify

  documentation:
    needs: scope
    if: needs.scope.outputs.mode == 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify documentation routing safeguards
        run: python3 scripts/ci/test-ci-scope.py
      - name: Validate the documentation-only candidate
        run: python3 scripts/ci/ci-scope.py docs

  frontend:
    needs: scope
    if: needs.scope.outputs.mode != 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Scan the built client bundle for server secrets
        run: python3 scripts/ci/scan-client-bundle.py
      - run: npm audit --audit-level=high

  backend-quality:
    needs: scope
    if: needs.scope.outputs.mode != 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, bcmath, gd, zip, curl, posix
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: vendor/bin/pint --version
      - run: composer audit
      - name: Verify shard partition safeguards
        run: python3 scripts/ci/test-phpunit-shards.py
      - name: Verify CI routing and focused-selection safeguards
        run: |
          python3 scripts/ci/test-ci-scope.py
          python3 scripts/ci/test-focused-tests.py
          python3 scripts/ci/test-database-receipts.py

  backend-mysql:
    needs: scope
    if: needs.scope.outputs.mode != 'docs'
    name: backend-mysql (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # A shard takes 22 to 38 minutes and has taken 57 on a slow runner. A hung test must not hold a runner for the 6-hour default.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: vaseyaudio_test
          MYSQL_ROOT_PASSWORD: ci-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: vaseyaudio_test
      DB_USERNAME: root
      DB_PASSWORD: ci-only-password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, bcmath, gd, zip, curl, posix
          coverage: none
          tools: composer:v2
      - name: Install bounded media and PDF verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg util-linux qpdf poppler-utils
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - name: Record source and MySQL runtime before tests
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: python3 scripts/ci/database-receipts.py start --engine=mysql --shard=${{ matrix.shard }}
      - name: Prove the complete MySQL test partition
        run: python3 scripts/ci/phpunit-shards.py --shards=4 --prefix=phpunit-ci-mysql --timings=scripts/ci/phpunit-timings-mysql.json
      - name: Run all tests assigned to this MySQL shard
        id: database_tests
        run: php vendor/bin/phpunit --configuration=phpunit-ci-mysql-${{ matrix.shard }}.xml --log-junit=phpunit-ci-mysql-${{ matrix.shard }}-results.xml --fail-on-phpunit-warning --display-warnings
      - name: Verify complete MySQL shard receipt
        if: always()
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
          DATABASE_TEST_OUTCOME: ${{ steps.database_tests.outcome }}
        run: python3 scripts/ci/database-receipts.py finish --engine=mysql --shard=${{ matrix.shard }}
      - name: Retain partition and test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-mysql-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: phpunit-ci-mysql-*
          retention-days: 7
          if-no-files-found: error
          overwrite: false

  backend-sqlite:
    needs: scope
    if: needs.scope.outputs.mode != 'docs'
    name: backend-sqlite (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    # A shard takes 7 to 20 minutes; a slow runner and a slow package mirror together could take it past 40.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, bcmath, gd, zip, curl, posix
          coverage: none
          tools: composer:v2
      - name: Install bounded media and PDF verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg util-linux qpdf poppler-utils
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - name: Record source and SQLite runtime before tests
        run: python3 scripts/ci/database-receipts.py start --engine=sqlite --shard=${{ matrix.shard }}
      - name: Prove the complete SQLite test partition
        run: python3 scripts/ci/phpunit-shards.py --shards=2 --prefix=phpunit-ci-sqlite --timings=scripts/ci/phpunit-timings-sqlite.json
      - name: Run all tests assigned to this SQLite shard
        id: database_tests
        run: php vendor/bin/phpunit --configuration=phpunit-ci-sqlite-${{ matrix.shard }}.xml --log-junit=phpunit-ci-sqlite-${{ matrix.shard }}-results.xml --fail-on-phpunit-warning --display-warnings
      - name: Verify complete SQLite shard receipt
        if: always()
        env:
          DATABASE_TEST_OUTCOME: ${{ steps.database_tests.outcome }}
        run: python3 scripts/ci/database-receipts.py finish --engine=sqlite --shard=${{ matrix.shard }}
      - name: Retain partition and test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-sqlite-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: phpunit-ci-sqlite-*
          retention-days: 7
          if-no-files-found: error
          overwrite: false

  backend:
    # Preserve the required check name and explicitly validate the selected mode.
    # Runtime mode requires every full database, frontend, browser and quality job.
    if: always()
    needs: [scope, documentation, backend-quality, backend-mysql, backend-sqlite, frontend, operator-browser, related-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require all evidence for the classified mode
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/ci-scope.py gate
      - name: Verify all six current-run database receipts without enabling reuse
        if: needs.scope.outputs.mode == 'full'
        env:
          RECEIPT_GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/database-receipts.py collect
      - name: Retain database collection and full-only shadow decision
        if: needs.scope.outputs.mode == 'full'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: database-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: phpunit-ci-shadow-receipt.json
          retention-days: 7
          if-no-files-found: error
          overwrite: false

  operator-browser:
    needs: scope
    if: needs.scope.outputs.mode != 'docs'
    name: operator-browser (${{ matrix.project }})
    runs-on: ubuntu-latest
    # Each engine runs every ordinary journey on its own fresh VM and isolated fixture.
    # Browser installation has taken 14 minutes; retain the bounded 18-minute suite
    # plus fixture/build setup, teardown and artifact retention for each engine.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-desktop, webkit-mobile]
    env:
      BROWSER_PROJECT: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, bcmath, gd, zip, curl, posix
          coverage: none
          tools: composer:v2
      - name: Install application media fixture prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg util-linux
          test -x /usr/bin/ffmpeg
          test -x /usr/bin/ffprobe
          test -x /usr/bin/prlimit
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser -- --project="$BROWSER_PROJECT"
      - name: Retain synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: operator-browser-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  related-browser:
    # Keep genuinely ready catalog fixtures separate from the empty-catalog native suite.
    needs: scope
    if: needs.scope.outputs.mode != 'docs'
    runs-on: ubuntu-latest
    # Tool setup and fixture preparation each have their own ten-minute ceiling;
    # browser installation has previously taken fourteen minutes on hosted runners.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, bcmath, gd, zip, curl, posix
          coverage: none
          tools: composer:v2
      - name: Install genuine scanner and current official signatures on this disposable runner
        run: bash tests/browser/install-related-scanner.sh
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - name: Verify isolated related-browser startup boundaries
        run: python3 scripts/ci/test-related-browser-stage.py
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Prepare genuine media and run only the related-track native journeys
        run: node tests/browser/run-related.mjs
      - name: Retain genuine related-track browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: related-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report-related/
            test-results-related/
          retention-days: 7
          if-no-files-found: ignore
