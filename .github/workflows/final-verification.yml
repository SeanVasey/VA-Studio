name: Foundation CI

# Full suites are an explicit final-verification action, not a per-merge gate.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character commit SHA reviewed for final verification
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the exact final candidate before allocating suites
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python3 scripts/ci/verify-final-candidate.py
      - name: Prove the changed-file scope
        id: classify
        run: python3 scripts/ci/ci-scope.py classify

  documentation:
    needs: scope
    if: needs.scope.outputs.mode == 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify documentation routing safeguards
        run: python3 scripts/ci/test-ci-scope.py
      - name: Validate the documentation-only candidate
        run: python3 scripts/ci/ci-scope.py docs

  frontend:
    needs: scope
    if: needs.scope.outputs.mode != 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify the pinned WebKit backport safeguards
        run: node --test scripts/ci/apply-playwright-webkit-offline-backport.test.mjs
      - run: npm test
      - run: npm run build
      - name: Scan the built client bundle for server secrets
        run: python3 scripts/ci/scan-client-bundle.py
      - name: Build the isolated storefront preview
        run: npm run build:preview
      - name: Scan the preview bundle for server secrets
        run: python3 scripts/ci/scan-client-bundle.py dist/design-preview
      - run: npm audit --audit-level=high

  backend-quality:
    needs: scope
    if: needs.scope.outputs.mode != 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, bcmath, gd, zip, curl, fileinfo, dom, xml, xmlwriter, posix, pcntl
          ini-values: memory_limit=512M
          coverage: none
          tools: composer:v2
      - name: Verify bounded PHP test capabilities
        run: php scripts/ci/verify-php-test-runtime.php
      - run: composer install --no-interaction --prefer-dist
      - name: Verify isolated private alpha startup and recovery
        env:
          PRIVATE_ALPHA_REQUIRE_PHP: '1'
        run: node --test scripts/dev/private-alpha.test.mjs
      # Native HTTP fixtures need genuine assets in this fresh checkout.
      - run: npm ci
      - name: Build assets for persistent authoring HTTP checks
        run: npm run build
      - name: Verify persistent private authoring and restart safeguards
        env:
          PERSISTENT_CONTENT_REQUIRE_PHP: '1'
        run: node --test scripts/dev/persistent-content.test.mjs
      - name: Verify stopped private installation copy upgrades
        if: github.event_name == 'workflow_dispatch'
        env:
          PERSISTENT_UPGRADE_REQUIRE_PHP: '1'
        run: node --test scripts/ops/persistent-content-upgrade.test.mjs
      - name: Verify bounded private catalog import and restart
        if: github.event_name == 'workflow_dispatch'
        env:
          PERSISTENT_CATALOG_REQUIRE_PHP: '1'
        run: node --test scripts/migration/persistent-catalog.test.mjs
      - run: composer validate --strict
      - run: vendor/bin/pint --version
      - name: Verify private store foundations formatting
        run: php vendor/bin/pint --test config/memberships.php app/Domain/Commerce/Policy app/Domain/Commerce/ProductionPolicy app/Domain/Commerce/ProductionPreparation app/Domain/Memberships app/Domain/Notifications app/Domain/ProductAuthoring app/Domain/Services app/Domain/Merch app/Domain/Migration/CatalogOnboarding app/Filament/Resources/MembershipCreditResource.php app/Filament/Resources/MembershipCreditResource app/Filament/Resources/MembershipPlanResource.php app/Filament/Resources/MembershipPlanResource app/Filament/Resources/PrivateProductDraftResource.php app/Filament/Resources/PrivateProductDraftResource app/Filament/Resources/ServiceDraftResource.php app/Filament/Resources/ServiceDraftResource app/Filament/Resources/MerchDraftResource.php app/Filament/Resources/MerchDraftResource
      - name: Verify the current rights-writer formatting boundary
        run: php vendor/bin/pint --test app/Domain/Catalog/SaveTrackMetadata.php app/Domain/Catalog/SaveOfferDraft.php app/Domain/Catalog/DeactivateOffer.php tests/Feature/CatalogWriterAuthorityTest.php tests/Feature/RightsDeclarationWriterConcurrencyTest.php tests/Support/rights-declaration-writer-worker.php app/Domain/Rights/CreateLicenseDraft.php app/Domain/Rights/UpdateLicenseDraft.php app/Domain/Rights/ReviewLicense.php app/Domain/Rights/PublishLicense.php app/Domain/Catalog/PrepareExclusiveOffer.php app/Domain/Catalog/ActivateExclusiveOffer.php app/Domain/Commerce/Inventory/ManageRightsScope.php tests/Feature/LicenseWriterAuthorityTest.php tests/Feature/ExclusiveWriterAuthorityTest.php tests/Feature/RightsScopeWriterAuthorityTest.php tests/Feature/RightsScopeWriterConcurrencyTest.php tests/Support/rights-scope-writer-worker.php
      - name: Verify captured offer authoring formatting
        run: php vendor/bin/pint --test app/Domain/Catalog/ReviewedOfferDraft.php app/Domain/Catalog/OfferDraftInput.php app/Filament/Resources/OfferResource.php app/Filament/Resources/OfferResource/Pages/ManageOffers.php tests/Feature/ReviewedOfferDraftTest.php tests/Feature/ReviewedOfferDraftConcurrencyTest.php tests/Feature/OfferDraftAuthoringActionTest.php tests/Unit/OfferDraftBrowserEvidenceTest.php tests/Support/ReviewedOfferDraftFixtures.php tests/Support/reviewed-offer-draft-worker.php tests/browser/prepare-offer-draft.php
      - name: Verify private authoring and commerce readiness formatting
        run: php vendor/bin/pint --test app/Domain/Rights/BulkReplaceLicenseDraftSource.php app/Filament/Resources/LicenseVersionResource.php app/Filament/Resources/LicenseVersionResource/Pages/ManageLicenseVersions.php tests/Feature/BulkReplaceLicenseDraftSourceTest.php tests/Feature/BulkReplaceLicenseDraftSourceConcurrencyTest.php tests/Feature/BulkLicenseDraftSourceAuthoringActionTest.php tests/Unit/BulkLicenseDraftSourceBrowserEvidenceTest.php tests/Support/BulkReplaceLicenseDraftSourceFixtures.php tests/Support/bulk-replace-license-draft-source-worker.php tests/browser/prepare-bulk-license-draft-source.php app/Domain/Commerce/Readiness/ProductionCommerceReadiness.php app/Console/Commands/CommerceReadiness.php tests/Feature/ProductionCommerceReadinessTest.php scripts/dev/persistent-content-bootstrap.php
      - run: composer audit
      - name: Verify shard partition safeguards
        run: python3 scripts/ci/test-phpunit-shards.py
      - name: Verify CI routing and focused-selection safeguards
        run: |
          python3 scripts/ci/test-ci-scope.py
          python3 scripts/ci/test-workflow-cadence.py
          python3 scripts/ci/test-focused-tests.py
          python3 scripts/ci/test-database-receipts.py
          python3 scripts/ci/test-gitlab-database-receipts.py
          python3 scripts/ci/test-gitlab-writer-feedback.py
          python3 scripts/ci/test-php-test-runtime.py
          python3 scripts/dev/test-bootstrap-macos.py
          python3 scripts/test-publish-github.py

  backend-mysql:
    # Do not start costly suites for a candidate that already fails preflight.
    needs: [scope, backend-quality, frontend]
    if: needs.scope.outputs.mode != 'docs'
    name: backend-mysql (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    # MySQL runs only the reviewed native selection (scripts/ci/database-mysql-selection.json): files owning
    # SQLite-skipped methods, migration test files and a reviewed include list, 1765 of 7642 cases in 163 files.
    # Run 37921309772 showed the complete suite cannot finish in 8 x 90 minutes (about 35 s per migrate:fresh
    # test). The selection's duration on hosted MySQL is unmeasured: 1372 selected cases use
    # FinalizationDatabaseMigrations (124 to 241 per shard), about 72 to 141 minutes at 35 s each, so the limit
    # is 210 minutes (about 50% headroom) until fresh MySQL timings exist. A hung test still cannot hold a runner for 6 hours.
    timeout-minutes: 210
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: vaseyaudio_test
          MYSQL_ROOT_PASSWORD: ci-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: vaseyaudio_test
      DB_URL: ''
      DB_SOCKET: ''
      DB_USERNAME: root
      DB_PASSWORD: ci-only-password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      # This job owns its disposable MySQL service container, so the native attachment-consumer tests may run
      # their test-only migrate:fresh here; without the flag they skip on MySQL.
      ATTACHMENT_NATIVE_ISOLATED: '1'
      # Admits the CI job's disposable DB_DATABASE where free-grant tests otherwise require their dedicated
      # schema (tests/Support/DisposableNativeDatabase.php also requires CI=true and APP_ENV=testing).
      VA_CI_DISPOSABLE_MYSQL: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, bcmath, gd, zip, curl, fileinfo, dom, xml, xmlwriter, posix, pcntl
          ini-values: memory_limit=512M
          coverage: none
          tools: composer:v2
      - name: Verify bounded PHP test capabilities
        run: php scripts/ci/verify-php-test-runtime.php
      - name: Install bounded media and PDF verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg util-linux qpdf poppler-utils
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - name: Record source and MySQL runtime before tests
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: python3 scripts/ci/database-receipts.py start --engine=mysql --shard=${{ matrix.shard }}
      - name: Prove the native-selection MySQL test partition
        run: python3 scripts/ci/phpunit-shards.py --shards=8 --prefix=phpunit-ci-mysql --timings=scripts/ci/phpunit-timings-mysql.json --mysql-native-selection
      - name: Run all tests assigned to this MySQL shard
        id: database_tests
        run: php vendor/bin/phpunit --configuration=phpunit-ci-mysql-${{ matrix.shard }}.xml --log-junit=phpunit-ci-mysql-${{ matrix.shard }}-results.xml --fail-on-phpunit-warning --display-warnings
      - name: Verify complete MySQL shard receipt
        if: always()
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
          DATABASE_TEST_OUTCOME: ${{ steps.database_tests.outcome }}
        run: python3 scripts/ci/database-receipts.py finish --engine=mysql --shard=${{ matrix.shard }}
      - name: Retain partition and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-mysql-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: phpunit-ci-mysql-*
          retention-days: 7
          if-no-files-found: error
          overwrite: false

  backend-sqlite:
    # Do not start costly suites for a candidate that already fails preflight.
    needs: [scope, backend-quality, frontend]
    if: needs.scope.outputs.mode != 'docs'
    name: backend-sqlite (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    # Foundation 37967128232 measured 47.5 minutes for shard 1; shard 2 was cut off by the former 60-minute
    # limit at 3,294 of 3,725 tests (88%, about 67 minutes projected). 100 minutes leaves about 45% headroom until the
    # SQLite timings are regenerated. A hung test still cannot hold a runner for 6 hours.
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      DB_SOCKET: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, bcmath, gd, zip, curl, fileinfo, dom, xml, xmlwriter, posix, pcntl
          ini-values: memory_limit=512M
          coverage: none
          tools: composer:v2
      - name: Verify bounded PHP test capabilities
        run: php scripts/ci/verify-php-test-runtime.php
      - name: Install bounded media and PDF verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg util-linux qpdf poppler-utils
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - name: Record source and SQLite runtime before tests
        run: python3 scripts/ci/database-receipts.py start --engine=sqlite --shard=${{ matrix.shard }}
      - name: Prove the complete SQLite test partition
        run: python3 scripts/ci/phpunit-shards.py --shards=2 --prefix=phpunit-ci-sqlite --timings=scripts/ci/phpunit-timings-sqlite.json
      - name: Run all tests assigned to this SQLite shard
        id: database_tests
        run: php vendor/bin/phpunit --configuration=phpunit-ci-sqlite-${{ matrix.shard }}.xml --log-junit=phpunit-ci-sqlite-${{ matrix.shard }}-results.xml --fail-on-phpunit-warning --display-warnings
      - name: Verify complete SQLite shard receipt
        if: always()
        env:
          DATABASE_TEST_OUTCOME: ${{ steps.database_tests.outcome }}
        run: python3 scripts/ci/database-receipts.py finish --engine=sqlite --shard=${{ matrix.shard }}
      - name: Retain partition and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-sqlite-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: phpunit-ci-sqlite-*
          retention-days: 7
          if-no-files-found: error
          overwrite: false

  backend:
    # Preserve the required check name and explicitly validate the selected mode.
    # Runtime mode requires every full database, frontend, browser and quality job.
    if: always()
    needs: [scope, documentation, backend-quality, backend-mysql, backend-sqlite, frontend, operator-browser, related-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require all evidence for the classified mode
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/ci-scope.py gate
      - name: Verify all ten current-run database receipts without enabling reuse
        if: needs.scope.outputs.mode == 'full'
        env:
          RECEIPT_GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/database-receipts.py collect
      - name: Retain database collection and full-only shadow decision
        if: needs.scope.outputs.mode == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: database-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: phpunit-ci-shadow-receipt.json
          retention-days: 7
          if-no-files-found: error
          overwrite: false

  operator-browser:
    # Do not start costly suites for a candidate that already fails preflight.
    needs: [scope, backend-quality, frontend]
    if: needs.scope.outputs.mode != 'docs'
    name: operator-browser (${{ matrix.project }})
    runs-on: ubuntu-latest
    # Each engine runs every ordinary journey on its own fresh VM and isolated fixture.
    # Browser installation has taken 14 minutes; retain the bounded 26-minute suite
    # plus fixture/build setup, teardown and artifact retention for each engine.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-desktop, webkit-mobile]
    env:
      BROWSER_PROJECT: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, bcmath, gd, zip, curl, fileinfo, dom, xml, xmlwriter, posix, pcntl
          ini-values: memory_limit=512M
          coverage: none
          tools: composer:v2
      - name: Verify bounded PHP test capabilities
        run: php scripts/ci/verify-php-test-runtime.php
      - name: Install genuine scanner and current official signatures for customer delivery fixtures
        run: bash tests/browser/install-related-scanner.sh
      - name: Verify application media fixture executables
        run: |
          test -x /usr/bin/ffmpeg
          test -x /usr/bin/ffprobe
          test -x /usr/bin/prlimit
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser -- --project="$BROWSER_PROJECT"
      - name: Retain synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: operator-browser-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Retain inspectable native recovery images
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: operator-recovery-images-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/**/public-offline-recovery.png
            test-results/**/license-draft-stale-input.png
            test-results/**/license-draft-lost-response-recovery.png
            test-results/**/license-draft-saved-reopen.png
            test-results/**/offer-draft-stale-input.png
            test-results/**/offer-draft-lost-response-recovery.png
            test-results/**/offer-draft-saved-reopen.png
            test-results/**/bulk-license-source-review.png
            test-results/**/bulk-license-source-stale-review.png
            test-results/**/bulk-license-source-lost-response.png
          retention-days: 7
          if-no-files-found: error
          overwrite: false

  related-browser:
    # Keep genuinely ready catalog fixtures separate from the empty-catalog native suite.
    # Do not start costly suites for a candidate that already fails preflight.
    needs: [scope, backend-quality, frontend]
    if: needs.scope.outputs.mode != 'docs'
    runs-on: ubuntu-latest
    # Tool setup and fixture preparation each have their own ten-minute ceiling;
    # browser installation has previously taken fourteen minutes on hosted runners.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, bcmath, gd, zip, curl, fileinfo, dom, xml, xmlwriter, posix, pcntl
          ini-values: memory_limit=512M
          coverage: none
          tools: composer:v2
      - name: Verify bounded PHP test capabilities
        run: php scripts/ci/verify-php-test-runtime.php
      - name: Install genuine scanner and current official signatures on this disposable runner
        run: bash tests/browser/install-related-scanner.sh
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run build
      - name: Verify isolated related-browser startup boundaries
        run: python3 scripts/ci/test-related-browser-stage.py
      - run: npx playwright install --with-deps chromium webkit
      - name: Prepare genuine media and run only the related-track native journeys
        run: node tests/browser/run-related.mjs
      - name: Retain genuine related-track browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: related-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report-related/
            test-results-related/
          retention-days: 7
          if-no-files-found: ignore
