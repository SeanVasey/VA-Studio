    - name: Require unchanged tracked source and digest all retained evidence
      if: always()
      run: |
        set -euo pipefail
        python3 <<'CODE' 2>&1 | tee pwa-evidence/source-bookend.log
        from pathlib import Path
        import hashlib,json,subprocess
        root=Path.cwd();source=json.loads(Path('pwa-evidence/source.json').read_text())
        files=subprocess.check_output(['git','ls-files'],text=True).splitlines()
        actual={path:hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in files}
        if actual!=source['sha256'] or subprocess.check_output(['git','status','--porcelain','--untracked-files=no'],text=True).strip():
            raise SystemExit('Verification changed tracked source.')
        evidence={str(path.relative_to(root)):{'bytes':path.stat().st_size,'sha256':hashlib.sha256(path.read_bytes()).hexdigest()} for folder in ['pwa-evidence','playwright-report','test-results'] for path in (root/folder).rglob('*') if path.is_file() and path.name not in ['source-bookend.log','evidence-digests.json']}
        Path('pwa-evidence/evidence-digests.json').write_text(json.dumps({'head':source['head'],'tree':source['tree'],'tracked_source_unchanged':True,'files':evidence},indent=2,sort_keys=True)+'\n')
        print(json.dumps({'tracked_source_unchanged':True,'retained_files':len(evidence)}))
