        from collections import Counter
        from pathlib import Path
        import base64,hashlib,json,math,struct,xml.etree.ElementTree as E
        root=Path.cwd();directory=root/'pwa-evidence'
        front=json.loads((directory/'frontend-results.json').read_text());records=front['testResults'];cases=[case for record in records for case in record['assertionResults']]
        if front['success'] is not True or len(records)!=23 or len(cases)!=361 or any(case['status']!='passed' for case in cases) or any(front[key]!=value for key,value in [('numTotalTests',361),('numPassedTests',361),('numFailedTests',0),('numPendingTests',0)]):
