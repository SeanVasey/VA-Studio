        title='public installation guidance and real assets survive private preview navigation without replacing the audio owner'
        pairs={('chromium-desktop',title),('webkit-mobile',title)}
        def native_cases(report):
            if Path(report['config']['rootDir']).resolve()!=root/'tests/browser' or report.get('errors'):
                raise SystemExit('Unexpected ordinary native root/errors.')
            if report['config'].get('globalTimeout')!=840000 or report['config'].get('workers')!=1:
                raise SystemExit('Ordinary native suite limits changed.')
            projects=report['config']['projects']
            if Counter(project['name'] for project in projects)!=Counter(['chromium-desktop','webkit-mobile']) or any(project['retries']!=0 or project['timeout']!=60000 or project['repeatEach']!=1 for project in projects):
                raise SystemExit('Ordinary native projects/case limits changed.')
            found=[]
            def walk(suite):
                for spec in suite.get('specs',[]):
                    if (root/'tests/browser'/spec['file']).resolve()!=root/'tests/browser/public-install.spec.ts' or spec['title']!=title:
                        raise SystemExit('Unexpected native file/title.')
                    found.extend((test['projectName'],spec['title'],spec,test) for test in spec['tests'])
                for child in suite.get('suites',[]):walk(child)
            for suite in report['suites']:walk(suite)
            if Counter((project,name) for project,name,_,_ in found)!=Counter(pairs):
                raise SystemExit('Exactly the two reviewed file/project identities are required.')
            return found
        native_cases(json.loads((directory/'native-discovery.json').read_text()))
        result=json.loads((directory/'native-results.json').read_text())
        if any(result['stats'].get(key)!=value for key,value in [('expected',2),('unexpected',0),('flaky',0),('skipped',0)]):
            raise SystemExit('Native statistics must contain two first-attempt passes.')
        manifest=json.loads((root/'public/manifest.webmanifest').read_text());receipts=[]
        for project,_,spec,test in native_cases(result):
            attempts=test['results']
            if not spec['ok'] or test['expectedStatus']!='passed' or test['timeout']!=60000 or len(attempts)!=1 or attempts[0]['status']!='passed' or attempts[0]['retry']!=0 or attempts[0].get('errors') or not math.isfinite(attempts[0]['duration']) or attempts[0]['duration']<0:
                raise SystemExit('Failed, skipped or retried native case.')
            attachments=[a for a in attempts[0]['attachments'] if a['name']=='public-installation-metadata' and a['contentType']=='application/json']
            if len(attachments)!=1:raise SystemExit('Missing genuine native installation metadata attachment.')
            attachment=attachments[0]
            if 'body' in attachment:body=base64.b64decode(attachment['body'],validate=True)
            else:
                path=Path(attachment['path']).resolve()
                if not path.is_relative_to(root/'test-results'):raise SystemExit('Unexpected attachment path.')
                body=path.read_bytes()
            evidence=json.loads(body)
            if set(evidence)!=set(['manifest','privateHeadRemoved','publicHeadRestored','nativeOwnerPreserved','physicalInstallationVerified']) or evidence['manifest']!=manifest or any(evidence[key] is not True for key in ['privateHeadRemoved','publicHeadRestored','nativeOwnerPreserved']) or evidence['physicalInstallationVerified'] is not False:
                raise SystemExit('Native metadata/privacy/audio receipt is incomplete or overclaims installation.')
            receipts.append({'project':project,'duration_ms':attempts[0]['duration'],'attachment_sha256':hashlib.sha256(body).hexdigest(),'evidence':evidence})
        screenshots=list((root/'test-results').rglob('public-installation-guidance.png'))
        if len(screenshots)!=2:raise SystemExit('Both genuine guidance screenshots are required.')
        images=[]
        for project,width in [('chromium-desktop',1440),('webkit-mobile',960)]:
            matching=[path for path in screenshots if project in str(path.relative_to(root/'test-results'))]
            if len(matching)!=1:raise SystemExit('Missing/duplicate project screenshot.')
            data=matching[0].read_bytes()
            if data[:8]!=b'\x89PNG\r\n\x1a\n' or len(data)<1000:raise SystemExit('Invalid genuine PNG screenshot.')
            dimensions=struct.unpack('>II',data[16:24])
            if dimensions[0]!=width or dimensions[1]<1:raise SystemExit('Unexpected project screenshot geometry.')
            images.append({'project':project,'path':str(matching[0].relative_to(root)),'dimensions':dimensions,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
        if not (root/'playwright-report/index.html').is_file() or not (root/'public/build/manifest.json').is_file():
            raise SystemExit('Missing genuine HTML report/build manifest.')
        built={str(path.relative_to(root)):{'bytes':path.stat().st_size,'sha256':hashlib.sha256(path.read_bytes()).hexdigest()} for path in (root/'public/build').rglob('*') if path.is_file()}
        receipt={'frontend_files':23,'frontend_cases':361,'new_frontend_cases':20,'native_cases':2,'native_retries':0,'native_receipts':receipts,'screenshots':images,'npm_vulnerabilities':vulnerabilities,'built_files':built,'scope':'PWA metadata/guidance/audio/privacy only; OS installation and complete Foundation acceptance remain open.'}
        (directory/'native-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
        print(json.dumps(receipt,sort_keys=True))
