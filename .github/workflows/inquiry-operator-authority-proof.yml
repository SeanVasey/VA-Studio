          result = {'cases': observed['cases'], 'census': r.census(observed), 'expected_sqlite_skip_ids': sorted(skipped),
              'discovery_sha256': hashlib.sha256((directory / 'php-discovery.xml').read_bytes()).hexdigest(),
              'sqlite_policy_sha256': hashlib.sha256((root / 'scripts/ci/database-sqlite-skips.json').read_bytes()).hexdigest(),
              'engine': os.environ['DB_CONNECTION']}
          (directory / 'discovery-receipt.json').write_text(json.dumps(result, indent=2, sort_keys=True)+'\n')
          print(json.dumps(result, sort_keys=True))
          PY
      - name: Run all three unchanged selections with strict issue handling
        run: |
          set -euo pipefail
          flags=(--fail-on-empty-test-suite --fail-on-all-issues --fail-on-phpunit-warning --fail-on-warning --fail-on-risky --fail-on-incomplete --display-all-issues)
          case "$DB_CONNECTION" in
            mysql) flags+=(--fail-on-skipped) ;;
            sqlite) flags+=(--do-not-fail-on-skipped) ;; # Only the nine exact discovered MySQL-only cases may skip.
            *) exit 1 ;;
          esac
          php vendor/bin/phpunit tests/Feature/CustomerInquiryHttpTest.php tests/Feature/CustomerInquiryAdminTest.php tests/Feature/CustomerInquiryConcurrencyTest.php --testdox --log-junit=inquiry-operator-evidence/php-results.xml "${flags[@]}" 2>&1 | tee inquiry-operator-evidence/phpunit.log
      - name: Require full genuine JUnit identities, exact skips and unchanged source
        run: |
          set -euo pipefail
          python3 <<'PY' 2>&1 | tee inquiry-operator-evidence/receipt-check.log
          from pathlib import Path
          import hashlib, importlib.util, json, os, subprocess
          root = Path.cwd(); directory = root / 'inquiry-operator-evidence'
          spec = importlib.util.spec_from_file_location('receipts', root / 'scripts/ci/database-receipts.py')
          r = importlib.util.module_from_spec(spec); spec.loader.exec_module(r)
          discovery = json.loads((directory / 'discovery-receipt.json').read_text())
          raw = (directory / 'php-discovery.xml').read_bytes()
          expected = r.inventory(raw, str(root))
          if expected['cases'] != discovery['cases'] or r.census(expected) != discovery['census'] or hashlib.sha256(raw).hexdigest() != discovery['discovery_sha256']:
              raise SystemExit('Discovery evidence changed after its strict source/provider check.')
          engine = os.environ['DB_CONNECTION']
          result = r.junit((directory / 'php-results.xml').read_bytes(), expected, str(root), engine, r.sqlite_skip_pairs(root))
          if (result['reported_cases'], result['executed_cases'], result['skipped_cases']) != (96, 96 if engine == 'mysql' else 87, 0 if engine == 'mysql' else 9):
              raise SystemExit('Unexpected genuine execution/skip census.')
          if engine == 'sqlite' and result['skipped_ids'] != discovery['expected_sqlite_skip_ids']:
              raise SystemExit('SQLite skip set differs from its exact nine expanded identities.')
          junit = r.xml((directory / 'php-results.xml').read_bytes())
          for case in junit.iter('testcase'):
              if case.find('skipped') is None and int(case.get('assertions', '0')) <= 0:
                  raise SystemExit('Every executed case must retain positive real assertions.')
          manifest = json.loads((directory / 'source.json').read_text())
          if subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=no'], text=True).strip():
              raise SystemExit('Verification changed tracked source.')
          for path,digest in manifest['sha256'].items():
              if hashlib.sha256((root / path).read_bytes()).hexdigest() != digest:
                  raise SystemExit('Verification changed source bytes: '+path)
          receipt = {'head': manifest['head'], 'tree': manifest['tree'], 'parent': manifest['parent'], 'reviewed_permanent_tree': manifest['reviewed_tree'],
              'engine': engine, 'discovery': discovery['census'], 'results': result,
              'new_operator_race_cases': 6 if engine == 'mysql' else 0,
              'race_contract': 'Unchanged assertions require separate PHP workers/connections and actual users PRIMARY row waiter/blocker in both orders, including an old valid RR snapshot; SQLite skips these precise MySQL-only identities.',
              'evidence_sha256': {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in directory.iterdir() if p.is_file() and p.name != 'receipt-check.log'}}
          (directory / 'receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True)+'\n')
          print(json.dumps(receipt, sort_keys=True))
          PY
      - name: Check formatting of all seven changed PHP paths after functional proof
        run: |
          set -euo pipefail
          php vendor/bin/pint --test -v app/Domain/Inquiries/InquiryPolicy.php app/Domain/Inquiries/SubmitInquiry.php app/Providers/AppServiceProvider.php app/Support/Access/AdminMultiFactor.php tests/Feature/CustomerInquiryConcurrencyTest.php tests/Support/InquiryOperatorRace.php tests/Support/inquiry-operator-race-worker.php 2>&1 | tee inquiry-operator-evidence/pint.log
      - name: Retain complete source, runtime, discovery, formatting and raw PHPUnit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inquiry-operator-authority-${{ matrix.engine }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: inquiry-operator-evidence/
          retention-days: 7
          if-no-files-found: error
          overwrite: false
