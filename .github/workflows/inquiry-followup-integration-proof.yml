        r = importlib.util.module_from_spec(spec); spec.loader.exec_module(r)
        discovery = json.loads((directory / 'discovery-receipt.json').read_text())
        raw = (directory / 'php-discovery.xml').read_bytes()
        expected = r.inventory(raw, str(root))
        if expected['cases'] != discovery['cases'] or r.census(expected) != discovery['census'] or hashlib.sha256(raw).hexdigest() != discovery['discovery_sha256']:
            raise SystemExit('Discovery evidence changed after its strict source/provider check.')
        engine = os.environ['DB_CONNECTION']
        result = r.junit((directory / 'php-results.xml').read_bytes(), expected, str(root), engine, r.sqlite_skip_pairs(root))
        if (result['reported_cases'], result['executed_cases'], result['skipped_cases']) != (128, 128 if engine == 'mysql' else 97, 0 if engine == 'mysql' else 31):
            raise SystemExit('Unexpected genuine execution/skip census.')
        if engine == 'sqlite' and result['skipped_ids'] != discovery['expected_sqlite_skip_ids']:
            raise SystemExit('SQLite skip set differs from its exact 31 expanded identities.')
        junit = r.xml((directory / 'php-results.xml').read_bytes())
        for case in junit.iter('testcase'):
            if case.find('skipped') is None and int(case.get('assertions', '0')) <= 0:
