    - name: Require unchanged tracked source and safe complete raw evidence before upload
      id: evidence_bookend
      if: always()
      run: |
        set -euo pipefail
        python3 <<'PY' 2>&1 | tee inquiry-followup-evidence/source-bookend.log
        from pathlib import Path
        import hashlib, json, subprocess
        root = Path.cwd(); directory = root / 'inquiry-followup-evidence'
        source = json.loads((directory / 'source.json').read_text())
        files = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
        actual = {path: hashlib.sha256((root / path).read_bytes()).hexdigest() for path in files}
        if len(files) != source['permanent_file_count'] + 1 or actual != source['sha256'] or subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=no'], text=True).strip():
            raise SystemExit('Verification changed the exact tracked source inventory/bytes.')
        for path in directory.rglob('*'):
            if path.is_symlink() or any(part.startswith('.') for part in path.relative_to(root).parts):
                raise SystemExit('Unexpected symlink or hidden raw evidence path; refusing upload.')
        evidence = {str(path.relative_to(root)): {'bytes': path.stat().st_size, 'sha256': hashlib.sha256(path.read_bytes()).hexdigest()} for path in directory.rglob('*') if path.is_file() and path.name not in ['source-bookend.log', 'evidence-digests.json']}
        (directory / 'evidence-digests.json').write_text(json.dumps({'head': source['head'], 'tree': source['tree'], 'tracked_source_unchanged': True, 'files': evidence}, indent=2, sort_keys=True) + '\n')
