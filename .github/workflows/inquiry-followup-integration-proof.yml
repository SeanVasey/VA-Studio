    - name: Run all six unchanged selections with strict issue handling
      run: |
        set -euo pipefail
        flags=(--fail-on-empty-test-suite --fail-on-all-issues --fail-on-phpunit-warning --fail-on-warning --fail-on-risky --fail-on-incomplete --display-all-issues)
        case "$DB_CONNECTION" in
          mysql) flags+=(--fail-on-skipped) ;;
          sqlite) flags+=(--do-not-fail-on-skipped) ;; # Only the 31 exact discovered MySQL-only cases may skip.
          *) exit 1 ;;
        esac
        php vendor/bin/phpunit tests/Feature/CustomerInquiryHttpTest.php tests/Feature/CustomerInquiryAdminTest.php tests/Feature/CustomerInquiryConcurrencyTest.php tests/Feature/InquiryNotificationWorkTest.php tests/Feature/InquiryNotificationConcurrencyTest.php tests/Feature/CustomerInquiryAdministrationConcurrencyTest.php --testdox --log-junit=inquiry-followup-evidence/php-results.xml "${flags[@]}" 2>&1 | tee inquiry-followup-evidence/phpunit.log
