        (directory / 'source.patch').write_bytes(subprocess.check_output(['git', 'diff', '--binary', parent, 'HEAD']))
        (directory / 'checkpoint.patch').write_bytes(subprocess.check_output(['git', 'diff', '--binary', baseline, parent]))
