# Isolated six-file integration feedback; final complete Foundation acceptance remains required.
name: Inquiry follow-up integration formatting proof
permissions:
  contents: read
concurrency:
  group: inquiry-followup-format-proof
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  inquiry-followup-integration:
    name: Inquiry follow-up integration PHP proof (${{ matrix.engine }})
    if: github.repository == 'VASEYDEV/VASEYAUDIO' && github.ref == 'refs/heads/codex/inquiry-followup-format-proof-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine:
        - sqlite
        - mysql
    services:
      mysql:
        image: ${{ matrix.engine == 'mysql' && 'mysql:8.4' || '' }}
        env:
          MYSQL_DATABASE: vaseyaudio_inquiry_followup_proof
          MYSQL_ROOT_PASSWORD: ci-only-password
        ports:
        - 3306:3306
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password" --health-interval=10s --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_URL: https://audio.example.test
      ASSET_URL: ''
      DB_CONNECTION: ${{ matrix.engine }}
      DB_DATABASE: ${{ matrix.engine == 'mysql' && 'vaseyaudio_inquiry_followup_proof' || ':memory:' }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ci-only-password
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: 'null'
      MAIL_MAILER: array
      PULSE_ENABLED: 'false'
      TELESCOPE_ENABLED: 'false'
      NIGHTWATCH_ENABLED: 'false'
      CONTACT_INQUIRIES_ENABLED: 'false'
      CONTACT_INQUIRY_OPERATOR_NOTIFICATIONS_ENABLED: 'false'
      STRIPE_WEBHOOK_ENABLED: 'false'
      STRIPE_TEST_CHECKOUT_ENABLED: 'false'
      STRIPE_TEST_PAYMENT_PROCESSING_ENABLED: 'false'
      STRIPE_TEST_FINALIZATION_ENABLED: 'false'
      STRIPE_TEST_FINALIZATION_POLICY: ''
      STRIPE_TEST_SECRET_KEY: ''
      STRIPE_WEBHOOK_SECRET: ''
      STRIPE_ACCOUNT_ID: ''
      VASEY_TEST_CONTRACT_ISSUANCE_ENABLED: 'false'
      VASEY_TEST_FULFILLMENT_ACTIVATION_ENABLED: 'false'
      VASEY_TEST_DELIVERY_ACCESS_ENABLED: 'false'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 3
    - name: Require the exact published parent and reviewed permanent source
