inistrationRace.php': '7b1c07046393dbdf0c1658ecfeef4d029ea83132fd27e117872152d8f38d6dd7', 'tests/Support/inquiry-administration-race-worker.php': 'cb38460d28072d254aebc6dd53fc6dcf9b806ab8a154b9c524fe1d80b6275212'}
        for path, digest in expected.items():
            if hashlib.sha256(Path(path).read_bytes()).hexdigest() != digest:
                raise SystemExit('Unexpected reviewed source hash: ' + path)
        with tempfile.TemporaryDirectory() as tmp:
            env = dict(os.environ, GIT_INDEX_FILE=str(Path(tmp) / 'index'))
            subprocess.run(['git', 'read-tree', 'HEAD'], env=env, check=True)
            subprocess.run(['git', 'update-index', '--force-remove', workflow], env=env, check=True)
            permanent_tree = subprocess.check_output(['git', 'write-tree'], env=env, text=True).strip()
        if permanent_tree != parent_tree:
            raise SystemExit('Removing the sole workflow did not restore the exact reviewed permanent tree.')
        files = git('ls-files').splitlines()
        if len(files) != permanent_file_count + 1 or len(git('ls-tree', '-r', '--name-only', parent).splitlines()) != permanent_file_count:
