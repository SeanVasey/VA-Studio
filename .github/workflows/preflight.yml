name: Development preflight

# Cheap checks for coherent PR candidates; full database/browser proof is manual.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prove the changed-file scope
        id: classify
        run: python3 scripts/ci/ci-scope.py classify

  documentation:
    needs: scope
    if: needs.scope.outputs.mode == 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify documentation routing safeguards
        run: python3 scripts/ci/test-ci-scope.py
      - name: Validate the documentation-only candidate
        run: python3 scripts/ci/ci-scope.py docs

  frontend:
    needs: scope
    if: needs.scope.outputs.mode != 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify the pinned WebKit backport safeguards
        run: node --test scripts/ci/apply-playwright-webkit-offline-backport.test.mjs
      - run: npm test
      - run: npm run build
      - name: Scan the built client bundle for server secrets
        run: python3 scripts/ci/scan-client-bundle.py
      - name: Build the isolated storefront preview
        run: npm run build:preview
      - name: Scan the preview bundle for server secrets
        run: python3 scripts/ci/scan-client-bundle.py dist/design-preview
      - run: npm audit --audit-level=high

  backend-quality:
    needs: scope
    if: needs.scope.outputs.mode != 'docs'
    runs-on: ubuntu-24.04  # ondrej/php has no packages for newer images yet
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, bcmath, gd, zip, curl, fileinfo, dom, xml, xmlwriter, posix, pcntl
          ini-values: memory_limit=512M
          coverage: none
          tools: composer:v2
      - name: Verify bounded PHP test capabilities
        run: php scripts/ci/verify-php-test-runtime.php
      - run: composer install --no-interaction --prefer-dist
      - name: Verify isolated private alpha startup and recovery
        env:
          PRIVATE_ALPHA_REQUIRE_PHP: '1'
        run: node --test scripts/dev/private-alpha.test.mjs
      # Native HTTP fixtures need genuine assets in this fresh checkout.
      - run: npm ci
      - name: Build assets for persistent authoring HTTP checks
        run: npm run build
      - name: Verify persistent private authoring and restart safeguards
        env:
          PERSISTENT_CONTENT_REQUIRE_PHP: '1'
        run: node --test scripts/dev/persistent-content.test.mjs
      - name: Verify stopped private installation copy upgrades
        if: github.event_name == 'workflow_dispatch'
        env:
          PERSISTENT_UPGRADE_REQUIRE_PHP: '1'
        run: node --test scripts/ops/persistent-content-upgrade.test.mjs
      - name: Verify bounded private catalog import and restart
        if: github.event_name == 'workflow_dispatch'
        env:
          PERSISTENT_CATALOG_REQUIRE_PHP: '1'
        run: node --test scripts/migration/persistent-catalog.test.mjs
      # A pinned render profile refuses at runtime once any file in its implementation closure changes (#216 broke
      # vasey-license-pdf-v1 this way unnoticed); rebuild it and compare byte for byte.
      - name: Verify pinned contract render profiles
        # The font decoder refuses any fontTools/brotli other than the versions the manifest records.
        run: |
          python3 -m venv "$RUNNER_TEMP/contract-fonts"
          "$RUNNER_TEMP/contract-fonts/bin/pip" install --quiet --disable-pip-version-check fonttools==4.68.0 brotli==1.2.1
          PATH="$RUNNER_TEMP/contract-fonts/bin:$PATH" php scripts/build-contract-profile-vasey-license-v1.php --check
          PATH="$RUNNER_TEMP/contract-fonts/bin:$PATH" php scripts/build-contract-profile-vasey-license-v2.php --check
          php scripts/build-contract-profile-vasey-kit-license-v1.php --check
      - run: composer validate --strict
      - run: vendor/bin/pint --version
      - name: Verify private store foundations formatting
        run: php vendor/bin/pint --test config/memberships.php app/Domain/Commerce/Policy app/Domain/Commerce/ProductionPolicy app/Domain/Commerce/ProductionPreparation app/Domain/Memberships app/Domain/Notifications app/Domain/ProductAuthoring app/Domain/Services app/Domain/Merch app/Domain/Migration/CatalogOnboarding app/Filament/Resources/MembershipCreditResource.php app/Filament/Resources/MembershipCreditResource app/Filament/Resources/MembershipPlanResource.php app/Filament/Resources/MembershipPlanResource app/Filament/Resources/PrivateProductDraftResource.php app/Filament/Resources/PrivateProductDraftResource app/Filament/Resources/ServiceDraftResource.php app/Filament/Resources/ServiceDraftResource app/Filament/Resources/MerchDraftResource.php app/Filament/Resources/MerchDraftResource
      - name: Verify the current rights-writer formatting boundary
        run: php vendor/bin/pint --test app/Domain/Catalog/SaveTrackMetadata.php app/Domain/Catalog/SaveOfferDraft.php app/Domain/Catalog/DeactivateOffer.php tests/Feature/CatalogWriterAuthorityTest.php tests/Feature/RightsDeclarationWriterConcurrencyTest.php tests/Support/rights-declaration-writer-worker.php app/Domain/Rights/CreateLicenseDraft.php app/Domain/Rights/UpdateLicenseDraft.php app/Domain/Rights/ReviewLicense.php app/Domain/Rights/PublishLicense.php app/Domain/Catalog/PrepareExclusiveOffer.php app/Domain/Catalog/ActivateExclusiveOffer.php app/Domain/Commerce/Inventory/ManageRightsScope.php tests/Feature/LicenseWriterAuthorityTest.php tests/Feature/ExclusiveWriterAuthorityTest.php tests/Feature/RightsScopeWriterAuthorityTest.php tests/Feature/RightsScopeWriterConcurrencyTest.php tests/Support/rights-scope-writer-worker.php
      - name: Verify captured offer authoring formatting
        run: php vendor/bin/pint --test app/Domain/Catalog/ReviewedOfferDraft.php app/Domain/Catalog/OfferDraftInput.php app/Filament/Resources/OfferResource.php app/Filament/Resources/OfferResource/Pages/ManageOffers.php tests/Feature/ReviewedOfferDraftTest.php tests/Feature/ReviewedOfferDraftConcurrencyTest.php tests/Feature/OfferDraftAuthoringActionTest.php tests/Unit/OfferDraftBrowserEvidenceTest.php tests/Support/ReviewedOfferDraftFixtures.php tests/Support/reviewed-offer-draft-worker.php tests/browser/prepare-offer-draft.php
      - name: Verify private authoring and commerce readiness formatting
        run: php vendor/bin/pint --test app/Domain/Rights/BulkReplaceLicenseDraftSource.php app/Filament/Resources/LicenseVersionResource.php app/Filament/Resources/LicenseVersionResource/Pages/ManageLicenseVersions.php tests/Feature/BulkReplaceLicenseDraftSourceTest.php tests/Feature/BulkReplaceLicenseDraftSourceConcurrencyTest.php tests/Feature/BulkLicenseDraftSourceAuthoringActionTest.php tests/Unit/BulkLicenseDraftSourceBrowserEvidenceTest.php tests/Support/BulkReplaceLicenseDraftSourceFixtures.php tests/Support/bulk-replace-license-draft-source-worker.php tests/browser/prepare-bulk-license-draft-source.php app/Domain/Commerce/Readiness/ProductionCommerceReadiness.php app/Console/Commands/CommerceReadiness.php tests/Feature/ProductionCommerceReadinessTest.php scripts/dev/persistent-content-bootstrap.php
      - run: composer audit
      - name: Verify shard partition safeguards
        run: python3 scripts/ci/test-phpunit-shards.py
      - name: Verify CI routing and focused-selection safeguards
        run: |
          python3 scripts/ci/test-ci-scope.py
          python3 scripts/ci/test-workflow-cadence.py
          python3 scripts/ci/test-focused-tests.py
          python3 scripts/ci/test-database-receipts.py
          python3 scripts/ci/test-gitlab-database-receipts.py
          python3 scripts/ci/test-gitlab-writer-feedback.py
          python3 scripts/ci/test-php-test-runtime.py
          python3 scripts/dev/test-bootstrap-macos.py
          python3 scripts/test-publish-github.py
      # The staging/production ops kits (tests/ops, build-kit) had no CI: PR #223 left three of their checks red on main.
      # They need the Composer dependencies above. They run last: installing php8.4-fpm from the PPA can replace
      # setup-php's CLI binary, so no later step may depend on it. The tests exercise real tools and root-only paths
      # (installers, root-owned files) and skip without them, so the runner is provisioned like a host (service starts
      # disabled while installing, needrestart suspended), they run as root, and a skipped test
      # fails the step: no check passes by skipping.
      - name: Verify the staging and production ops kits
        run: |
          printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d >/dev/null
          sudo chmod 0755 /usr/sbin/policy-rc.d
          sudo add-apt-repository -y -n ppa:ondrej/php  # php8.4-fpm for the production pool's `php-fpm8.4 -t` check
          sudo apt-get update -qq
          sudo NEEDRESTART_SUSPEND=1 apt-get install -y -qq --no-install-recommends nginx age rsync rclone supervisor clamav-daemon apparmor php8.4-fpm
          sudo rm -f /usr/sbin/policy-rc.d
          sudo env "PATH=$PATH" PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          import sys, unittest
          result = unittest.TextTestRunner(verbosity=1).run(unittest.defaultTestLoader.discover("tests/ops"))
          for test, reason in result.skipped:
              print(f"SKIPPED (not allowed in CI): {test.id()}: {reason}")
          sys.exit(0 if result.wasSuccessful() and not result.skipped else 1)
          PY
          python3 ops/production/build-kit.py --check

  preflight:
    name: Development preflight result
    if: always()
    needs: [scope, documentation, frontend, backend-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require actual preflight results without claiming full acceptance
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/preflight-gate.py
