            'discovery_sha256': hashlib.sha256((directory / 'php-discovery.xml').read_bytes()).hexdigest(),
            'sqlite_policy_sha256': hashlib.sha256((root / 'scripts/ci/database-sqlite-skips.json').read_bytes()).hexdigest(),
