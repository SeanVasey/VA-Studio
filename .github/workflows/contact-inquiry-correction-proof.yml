st::test_administration_and_revocation_serialize_on_current_authority_in_both_lock_orders#transition verified email administration first', 'Tests\\Feature\\CustomerInquiryAdministrationConcurrencyTest::test_administration_and_revocation_serialize_on_current_authority_in_both_lock_orders#transition verified email revocation first', 'Tests\\Feature\\CustomerInquiryAdministrationConcurrencyTest::test_administration_and_revocation_serialize_on_current_authority_in_both_lock_orders#view MFA enrollment administration first', 'Tests\\Feature\\CustomerInquiryAdministrationConcurrencyTest::test_administration_and_revocation_serialize_on_current_authority_in_both_lock_orders#view MFA enrollment revocation first', 'Tests\\Feature\\CustomerInquiryAdministrationConcurrencyTest::test_administration_and_revocation_serialize_on_current_authority_in_both_lock_orders#view admin role administration first', 'Tests\\Feature\\CustomerInquiryAdministrationConcurrencyTest::test_administration_and_revocation_serialize_on_current_authority_in_both_lock_orders#view admin role revocation first', 'Tests\\Feature\\CustomerInquiryAdministrationConcurrencyTest::test_administration_and_revocation_serialize_on_current_authority_in_both_lock_orders#view verified email administration first', 'Tests\\Feature\\CustomerInquiryAdministrationConcurrencyTest::test_administration_and_revocation_serialize_on_current_authority_in_both_lock_orders#view verified email revocation first', 'Tests\\Feature\\CustomerInquiryAdministrationConcurrencyTest::test_livewire_private_getters_reject_revocation_hidden_by_an_old_repeatable_read_snapshot#MFA enrollment', 'Tests\\Feature\\CustomerInquiryAdministrationConcurrencyTest::test_livewire_private_getters_reject_revocation_hidden_by_an_old_repeatable_read_snapshot#admin role', 'Tests\\Feature\\CustomerInquiryAdministrationConcurrencyTest::test_livewire_private_getters_reject_revocation_hidden_by_an_old_repeatable_read_snapshot#verified email', 'Tests\\Feature\\CustomerInquiryConcurrencyTest::test_competing_owners_with_one_global_request_key_save_exactly_one_inquiry_and_receipt_audit', 'Tests\\Feature\\CustomerInquiryConcurrencyTest::test_operator_authority_revocation_and_admission_share_the_current_user_lock#MFA enrollment admission first', 'Tests\\Feature\\CustomerInquiryConcurrencyTest::test_operator_authority_revocation_and_admission_share_the_current_user_lock#MFA enrollment revocation first', 'Tests\\Feature\\CustomerInquiryConcurrencyTest::test_operator_authority_revocation_and_admission_share_the_current_user_lock#admin admission first', 'Tests\\Feature\\CustomerInquiryConcurrencyTest::test_operator_authority_revocation_and_admission_share_the_current_user_lock#admin revocation first', 'Tests\\Feature\\CustomerInquiryConcurrencyTest::test_operator_authority_revocation_and_admission_share_the_current_user_lock#verified email admission first', 'Tests\\Feature\\CustomerInquiryConcurrencyTest::test_operator_authority_revocation_and_admission_share_the_current_user_lock#verified email revocation first', 'Tests\\Feature\\CustomerInquiryConcurrencyTest::test_publication_withdrawal_and_admission_share_one_mutex_without_stale_admission#admission takes the lock first', 'Tests\\Feature\\CustomerInquiryConcurrencyTest::test_publication_withdrawal_and_admission_share_one_mutex_without_stale_admission#withdrawal takes the lock first', 'Tests\\Feature\\CustomerInquiryConcurrencyTest::test_successor_publication_and_first_notice_admission_serialize_without_stale_context#admission takes the lock first', 'Tests\\Feature\\CustomerInquiryConcurrencyTest::test_successor_publication_and_first_notice_admission_serialize_without_stale_context#withdrawal takes the lock first']):
            raise SystemExit('Current policy expands a different exact MySQL-only selection.')
