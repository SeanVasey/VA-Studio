    - name: Run every selected contact regression with strict issue handling
      run: |
        set -euo pipefail
        flags=(--fail-on-empty-test-suite --fail-on-all-issues --fail-on-phpunit-warning --fail-on-warning --fail-on-risky --fail-on-incomplete --display-all-issues)
        case "$DB_CONNECTION" in
          mysql) flags+=(--fail-on-skipped) ;;
          sqlite) flags+=(--do-not-fail-on-skipped) ;; # Only the 32 exact discovered MySQL-only cases may skip.
          *) exit 1 ;;
        esac
        php vendor/bin/phpunit tests/Feature/CustomerInquiryHttpTest.php tests/Feature/CustomerInquiryAdminTest.php tests/Feature/CustomerInquiryConcurrencyTest.php tests/Feature/CustomerInquiryAdministrationConcurrencyTest.php --testdox --log-junit=contact-inquiry-evidence/php-results.xml "${flags[@]}" 2>&1 | tee contact-inquiry-evidence/phpunit.log
    - name: Require full genuine JUnit identities, exact skips and unchanged source
      run: |
        set -euo pipefail
        python3 <<'PY' 2>&1 | tee contact-inquiry-evidence/receipt-check.log
        from pathlib import Path
        import hashlib, importlib.util, json, os, subprocess
        root = Path.cwd(); directory = root / 'contact-inquiry-evidence'
        spec = importlib.util.spec_from_file_location('receipts', root / 'scripts/ci/database-receipts.py')
        r = importlib.util.module_from_spec(spec); spec.loader.exec_module(r)
        discovery = json.loads((directory / 'discovery-receipt.json').read_text())
        raw = (directory / 'php-discovery.xml').read_bytes()
        expected = r.inventory(raw, str(root))
        if expected['cases'] != discovery['cases'] or r.census(expected) != discovery['census'] or hashlib.sha256(raw).hexdigest() != discovery['discovery_sha256']:
            raise SystemExit('Discovery evidence changed after its strict source/provider check.')
        engine = os.environ['DB_CONNECTION']
