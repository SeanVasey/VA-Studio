# Temporary source-pinned correction feedback; complete Foundation acceptance remains required.
name: Contact inquiry correction proof
'on':
  push:
    branches:
    - codex/contact-inquiry-correction-retry-20261001
permissions:
  contents: read
concurrency:
  group: contact-inquiry-correction-proof
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  contact-php:
    name: Contact inquiry PHP correction (${{ matrix.engine }})
    if: github.repository == 'VASEYDEV/VASEYAUDIO' && github.ref == 'refs/heads/codex/contact-inquiry-correction-retry-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine:
        - sqlite
        - mysql
    services:
      mysql:
        image: ${{ matrix.engine == 'mysql' && 'mysql:8.4' || '' }}
        env:
          MYSQL_DATABASE: vaseyaudio_contact_correction_proof
          MYSQL_ROOT_PASSWORD: ci-only-password
        ports:
        - 3306:3306
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_URL: https://audio.example.test
      ASSET_URL: ''
      DB_CONNECTION: ${{ matrix.engine }}
      DB_DATABASE: ${{ matrix.engine == 'mysql' && 'vaseyaudio_contact_correction_proof' || ':memory:' }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ci-only-password
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: 'null'
      MAIL_MAILER: array
      PULSE_ENABLED: 'false'
      TELESCOPE_ENABLED: 'false'
      NIGHTWATCH_ENABLED: 'false'
      CONTACT_INQUIRIES_ENABLED: 'false'
      CONTACT_INQUIRY_OPERATOR_NOTIFICATIONS_ENABLED: 'false'
      STRIPE_WEBHOOK_ENABLED: 'false'
      STRIPE_TEST_CHECKOUT_ENABLED: 'false'
      STRIPE_TEST_PAYMENT_PROCESSING_ENABLED: 'false'
      STRIPE_TEST_FINALIZATION_ENABLED: 'false'
      STRIPE_TEST_FINALIZATION_POLICY: ''
      STRIPE_TEST_SECRET_KEY: ''
      STRIPE_WEBHOOK_SECRET: ''
      STRIPE_ACCOUNT_ID: ''
      VASEY_TEST_CONTRACT_ISSUANCE_ENABLED: 'false'
      VASEY_TEST_FULFILLMENT_ACTIVATION_ENABLED: 'false'
      VASEY_TEST_DELIVERY_ACCESS_ENABLED: 'false'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 3
    - name: Require the exact published checkpoint and all reviewed permanent bytes
      run: |
        set -euo pipefail
        mkdir contact-inquiry-evidence
        python3 <<'PY' 2>&1 | tee contact-inquiry-evidence/source-guard.log
        from pathlib import Path
        import hashlib, json, os, subprocess, tempfile
        git = lambda *args: subprocess.check_output(['git', *args], text=True).strip()
        parent = '1872179f5455d819e471ca3f015bc859f8879012'
        parent_tree = '94f3c72a67ec33c8009134603e420923966484c5'
        baseline = '8b7747421714670117b0ee1023b9d226638a2630'
        baseline_tree = 'af3571e2b290cbc57189d538883bcc2ad24625fe'
        workflow = '.github/workflows/contact-inquiry-correction-proof.yml'
        expected = {'app/Domain/Inquiries/InquiryInput.php': 'f6537ffb9a931e868159b117eb0225fbcabcee8fa386e681e7787ac87cac692c', 'app/Domain/Inquiries/InquiryPolicy.php': 'e488dd79b099d8f3e2a43ec6cc49d67b6dc6e2fe9626578226f8433c2d6bc458', 'app/Domain/Inquiries/SubmitInquiry.php': '4050effe895f4950f4b5a8e0e80d528f9c669673eba8b3164e18f50d7d4d5a4f', 'app/Http/Controllers/EditorialController.php': '587993d6662cec2586abe0629fc00ebe6c13152aff25c794b07909e9fad8ee77', 'app/Http/Requests/InquiryRequest.php': 'c92598202d8677c5b7db1dacbeb301ead8c9738d895802ae7a4e72136f996e05', 'docs/contact-inquiries.md': '65de685ddd7720432f8246142e8c0dead9c4fa279f2cb87b59162f0d06b2e516', 'resources/js/Pages/Editorial.tsx': 'fcf0ee39472c5392dcb5e612d3375dba7404c71a02d5c7f8dcdfaeed54f1d62c', 'resources/js/components/ContactInquiryForm.tsx': 'e838ecde4a073f2e264df2637f8230fed38bcabc42d8f2664a809194a95ae956', 'scripts/ci/database-sqlite-skips.json': '9156f27372e2fe6236d17f4959111624b130938702a998ba3b6ea257cbc4ac0c', 'tests/Feature/CustomerInquiryAdminTest.php': '648992af567b4c07e375e79775ad18e0ce5ba27e2d01caf44282f147b8ffff23', 'tests/Feature/CustomerInquiryAdministrationConcurrencyTest.php': '273a9b948b282cbee20aec47d2f44af2d1577ca4595ad34970955dc2e572ee36', 'tests/Feature/CustomerInquiryConcurrencyTest.php': '8294b51790aafc2384adf8ace78cb7c39db3974129833db6716c4c09297e2583', 'tests/Feature/CustomerInquiryHttpTest.php': 'be8b4e6bd1ad403320a8a7d8925c5f0544f6292223acffd5d2b1ded4e626774a', 'tests/Support/inquiry-race-worker.php': '42573b858447ecd25e523e342d097b61c381e9907146612341806e4cc1debe54', 'tests/browser/contact-inquiry-fixture.ts': 'a371030f31a34d3387583581db549d24b4b6b31a9a344890ec8061c1ab39967e', 'tests/browser/contact-inquiry-persistence.spec.ts': '40490cb05c8f2c6a4e12ad44e87990d8b82556bfc237c91ee1d632b3936c377e', 'tests/browser/contact-inquiry.spec.ts': '360328f8ba0c613436dac4c123b9a4bcf5141662afba269689dbf3af2fca79b6', 'tests/browser/prepare-contact-inquiry.php': 'f900a663a15f5236f017344662c80bc26a8837516ed76adb86e8ee172331619e', 'tests/frontend/contact-inquiry.test.tsx': '99744054726a0d26eb6653aab0fe5474b2f83ab502054c7933ac30ed8cffbbae', 'tests/frontend/editorial-content.test.tsx': '636f742b63fd9333a1418d0cfa0546f6de5475df4471965d135a6c8b2bb94768'}
        permanent_file_count = 911
        permanent_delta = {'app/Domain/Inquiries/InquiryInput.php': 'M', 'app/Domain/Inquiries/InquiryPolicy.php': 'M', 'app/Domain/Inquiries/SubmitInquiry.php': 'M', 'app/Http/Controllers/EditorialController.php': 'M', 'app/Http/Requests/InquiryRequest.php': 'M', 'docs/contact-inquiries.md': 'M', 'resources/js/Pages/Editorial.tsx': 'M', 'resources/js/components/ContactInquiryForm.tsx': 'M', 'scripts/ci/database-sqlite-skips.json': 'M', 'tests/Feature/CustomerInquiryAdminTest.php': 'M', 'tests/Feature/CustomerInquiryAdministrationConcurrencyTest.php': 'M', 'tests/Feature/CustomerInquiryConcurrencyTest.php': 'M', 'tests/Feature/CustomerInquiryHttpTest.php': 'M', 'tests/Support/inquiry-race-worker.php': 'M', 'tests/browser/contact-inquiry-fixture.ts': 'A', 'tests/browser/contact-inquiry-persistence.spec.ts': 'M', 'tests/browser/contact-inquiry.spec.ts': 'M', 'tests/browser/prepare-contact-inquiry.php': 'M', 'tests/frontend/contact-inquiry.test.tsx': 'M', 'tests/frontend/editorial-content.test.tsx': 'M'}
        event = {key: os.environ.get(key) for key in ['GITHUB_SHA', 'GITHUB_EVENT_NAME', 'GITHUB_REPOSITORY', 'GITHUB_REF']}
        if (event['GITHUB_EVENT_NAME'], event['GITHUB_REPOSITORY'], event['GITHUB_REF']) != ('push', 'VASEYDEV/VASEYAUDIO', 'refs/heads/codex/contact-inquiry-correction-retry-20261001'):
            raise SystemExit('Unexpected execution event/repository/ref.')
        if git('rev-parse', 'HEAD') != event['GITHUB_SHA'] or git('rev-parse', 'HEAD^') != parent or git('rev-parse', 'HEAD^^{tree}') != parent_tree:
            raise SystemExit('Unexpected actual proof head/checkpoint/tree.')
        if git('rev-parse', 'HEAD~2') != baseline or git('rev-parse', 'HEAD~2^{tree}') != baseline_tree:
            raise SystemExit('Unexpected source checkpoint ancestry.')
        status = lambda first,last: {path: change for change,path in (line.split('\t',1) for line in git('diff','--name-status','--no-renames',first,last).splitlines())}
        if status(parent,'HEAD') != {workflow:'A'} or status(baseline,parent) != permanent_delta:
            raise SystemExit('Unexpected temporary workflow or permanent correction delta.')
        if git('status','--porcelain','--untracked-files=no'):
            raise SystemExit('Tracked source is not clean.')
        with tempfile.TemporaryDirectory() as tmp:
            env = dict(os.environ, GIT_INDEX_FILE=str(Path(tmp)/'index'))
            subprocess.run(['git','read-tree','HEAD'],env=env,check=True)
            subprocess.run(['git','update-index','--force-remove',workflow],env=env,check=True)
            restored = subprocess.check_output(['git','write-tree'],env=env,text=True).strip()
        if restored != parent_tree:
            raise SystemExit('Removing the sole proof workflow does not restore the reviewed permanent tree.')
        files = git('ls-files').splitlines()
        parent_files = git('ls-tree','-r','--name-only',parent).splitlines()
        if set(files) != set(parent_files)|{workflow} or len(parent_files) != permanent_file_count or not set(expected).issubset(parent_files):
            raise SystemExit('Unexpected complete permanent/proof source census.')
        actual = {path:hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in files}
        if {path:actual[path] for path in expected} != expected:
            raise SystemExit('Reviewed permanent source hashes do not match actual checkout.')
        d = Path('contact-inquiry-evidence')
        (d/'source.patch').write_bytes(subprocess.check_output(['git','diff','--binary',parent,'HEAD']))
        (d/'checkpoint.patch').write_bytes(subprocess.check_output(['git','diff','--binary',baseline,parent]))
        source = {'head':git('rev-parse','HEAD'),'tree':git('rev-parse','HEAD^{tree}'),'actual_event':event,
            'parent':parent,'reviewed_tree':parent_tree,'baseline':baseline,'baseline_tree':baseline_tree,
            'source_delta':{workflow:'A'},'checkpoint_delta':permanent_delta,'permanent_file_count':permanent_file_count,'sha256':actual,
            'scope':'Source-specific contact notice/retry feedback. No complete Foundation, future follow-up, external delivery or launch acceptance is inferred.'}
        (d/'source.json').write_text(json.dumps(source,indent=2,sort_keys=True)+'\n')
        print(json.dumps({key:source[key] for key in ['head','tree','parent','reviewed_tree','permanent_file_count','checkpoint_delta']},sort_keys=True))
        PY
    - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45
      with:
        php-version: '8.4'
        extensions: mbstring, intl, pdo_mysql, pdo_sqlite, bcmath, gd, zip, curl, posix
        coverage: none
        tools: composer:v2
    - name: Install genuine Foundation fixture prerequisites
      run: |
        set -euo pipefail
        sudo apt-get update 2>&1 | tee contact-inquiry-evidence/apt-update.log
        sudo apt-get install --yes --no-install-recommends ffmpeg util-linux qpdf poppler-utils gcc 2>&1 | tee contact-inquiry-evidence/apt-install.log
        test -x /usr/bin/ffmpeg
        test -x /usr/bin/ffprobe
        test -x /usr/bin/prlimit
        test -x /usr/bin/qpdf
        test -x /usr/bin/pdfinfo
        test -x /usr/bin/gcc
    - name: Install and validate the exact locked backend dependencies
      run: |
        set -euo pipefail
        composer install --no-interaction --prefer-dist 2>&1 | tee contact-inquiry-evidence/composer-install.log
        composer validate --strict 2>&1 | tee contact-inquiry-evidence/composer-validate.log
        composer audit 2>&1 | tee contact-inquiry-evidence/composer-audit.log
    - name: Prepare the isolated application and record actual fresh database runtime
      run: |
        set -euo pipefail
        { cp .env.example .env; php artisan key:generate; } 2>&1 | tee contact-inquiry-evidence/application-setup.log
        {
          php --version
          php vendor/bin/phpunit --version
          php vendor/bin/pint --version
          composer --version
          ffmpeg -version
          ffprobe -version
          prlimit --version
          qpdf --version
          pdfinfo -v
          gcc --version
          php <<'PHP'
        <?php
        if (PHP_MAJOR_VERSION !== 8 || PHP_MINOR_VERSION !== 4) { throw new RuntimeException('PHP 8.4 required.'); }
        if (getenv('DB_CONNECTION') === 'mysql' && getenv('DB_DATABASE') === 'vaseyaudio_contact_correction_proof') {
            $db = new PDO('mysql:host=127.0.0.1;port=3306;dbname=vaseyaudio_contact_correction_proof', getenv('DB_USERNAME'), getenv('DB_PASSWORD'));
            $runtime = $db->query('SELECT VERSION() AS version, DATABASE() AS database_name, @@version_comment AS version_comment, @@sql_mode AS sql_mode, @@transaction_isolation AS transaction_isolation, @@lower_case_table_names AS lower_case_table_names')->fetch(PDO::FETCH_ASSOC);
            if (! str_starts_with($runtime['version'], '8.4.') || $runtime['database_name'] !== 'vaseyaudio_contact_correction_proof' || $runtime['transaction_isolation'] !== 'REPEATABLE-READ' || (int) $runtime['lower_case_table_names'] !== 0) {
                throw new RuntimeException('Unexpected disposable MySQL runtime.');
            }
            $tables = (int) $db->query("SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'vaseyaudio_contact_correction_proof'")->fetchColumn();
        } elseif (getenv('DB_CONNECTION') === 'sqlite' && getenv('DB_DATABASE') === ':memory:') {
            $db = new PDO('sqlite::memory:');
            $runtime = ['version' => $db->query('SELECT sqlite_version()')->fetchColumn(), 'database_name' => ':memory:'];
            $tables = (int) $db->query("SELECT COUNT(*) FROM sqlite_master WHERE type = 'table'")->fetchColumn();
        } else { throw new RuntimeException('Unexpected fixed database selection.'); }
        if ($tables !== 0) { throw new RuntimeException('Disposable database not empty before tests.'); }
        echo json_encode(['driver' => $db->getAttribute(PDO::ATTR_DRIVER_NAME), 'runtime' => $runtime, 'tables_before_tests' => $tables], JSON_THROW_ON_ERROR), PHP_EOL;
        PHP
        } 2>&1 | tee contact-inquiry-evidence/runtime.log
    - name: Verify unchanged routing, partition and receipt safeguards
      run: |
        set -euo pipefail
        { python3 scripts/ci/test-phpunit-shards.py; python3 scripts/ci/test-ci-scope.py; python3 scripts/ci/test-focused-tests.py; python3 scripts/ci/test-database-receipts.py; } 2>&1 | tee contact-inquiry-evidence/guards.log
    - name: Record genuine installed dependencies and source runtime identity
      env:
        MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
      run: |
        set -euo pipefail
        python3 <<'PY' 2>&1 | tee contact-inquiry-evidence/runtime-identity.log
        from pathlib import Path
        import importlib.util, json, os
        root = Path.cwd()
        spec = importlib.util.spec_from_file_location('receipts',root/'scripts/ci/database-receipts.py')
        r = importlib.util.module_from_spec(spec); spec.loader.exec_module(r)
        actual = r.runtime_identity(root, os.environ['DB_CONNECTION'], dict(os.environ))
        r.validate_runtime(actual, os.environ['DB_CONNECTION'])
        (root/'contact-inquiry-evidence/runtime-identity.json').write_text(json.dumps(actual,indent=2,sort_keys=True)+'\n')
        print(json.dumps({'engine':actual['engine'],'php':actual['php']['version'],'dependencies':actual['dependencies']},sort_keys=True))
        PY
    - name: Discover the exact reviewed four-file source/provider inventory
      run: |
        set -euo pipefail
        php vendor/bin/phpunit tests/Feature/CustomerInquiryHttpTest.php tests/Feature/CustomerInquiryAdminTest.php tests/Feature/CustomerInquiryConcurrencyTest.php tests/Feature/CustomerInquiryAdministrationConcurrencyTest.php --list-tests-xml=contact-inquiry-evidence/php-discovery.xml --fail-on-empty-test-suite --fail-on-all-issues --fail-on-phpunit-warning --display-all-issues 2>&1 | tee contact-inquiry-evidence/php-discovery.log
        python3 <<'PY' 2>&1 | tee contact-inquiry-evidence/discovery-check.log
        from pathlib import Path
        from collections import Counter
        import hashlib, importlib.util, json, os
        root = Path.cwd()
        directory = root / 'contact-inquiry-evidence'
        spec = importlib.util.spec_from_file_location('receipts', root / 'scripts/ci/database-receipts.py')
