name: Isolated supplemental byte guard formatting feedback

# Informative syntax/token/style bridge only. No functional replay or Foundation replacement.
on:
  push:
    branches: [codex/byte-guard-format-proof-20261001]

permissions:
  contents: read

concurrency:
  group: isolated-byte-guard-format-feedback
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  byte-guard-format:
    name: Supplemental byte guard exact formatting feedback
    if: github.repository == 'VASEYDEV/VASEYAUDIO' && github.ref == 'refs/heads/codex/byte-guard-format-proof-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      CONTACT_INQUIRIES_ENABLED: 'false'
      CONTACT_INQUIRY_OPERATOR_NOTIFICATIONS_ENABLED: 'false'
      STRIPE_TEST_CHECKOUT_ENABLED: 'false'
      STRIPE_TEST_PAYMENT_PROCESSING_ENABLED: 'false'
      STRIPE_TEST_FINALIZATION_ENABLED: 'false'
      STRIPE_WEBHOOK_ENABLED: 'false'
      STRIPE_TEST_SECRET_KEY: ''
      STRIPE_WEBHOOK_SECRET: ''
      STRIPE_ACCOUNT_ID: ''
      VASEY_TEST_CONTRACT_ISSUANCE_ENABLED: 'false'
      VASEY_TEST_FULFILLMENT_ACTIVATION_ENABLED: 'false'
      VASEY_TEST_DELIVERY_ACCESS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Verify the exact tested parent and only the four reviewed formatting changes
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REPOSITORY" = VASEYDEV/VASEYAUDIO
          test "$GITHUB_REF" = refs/heads/codex/byte-guard-format-proof-20261001
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = e291261f4fa298132155e0cfbea5600505826a1c
          test "$(git rev-parse HEAD^^{tree})" = ca2c3827338af68a914053137946185054868dae
          git diff --exit-code HEAD --
          test -z "$(git ls-files --others --exclude-standard)"
          mkdir byte-guard-format-evidence
          python <<'PYTHON' 2>&1 | tee byte-guard-format-evidence/source-guard.log
          import base64, hashlib, json, pathlib, re, subprocess
          hashes = {"database/migrations/2026_10_01_000029_byte_exact_hash_guards.php":{"old":"ace2f1c4188e2ebfa3ade2f1033e1dc84ff31a47912cdffedf405ae3056a4ae6","formatted":"93141102adbb97168529d94e89ca1e342ea5d48f8e1931e8a4f94b6aa2b64bde","snapshot":"previous-2026_10_01_000029_byte_exact_hash_guards.php"},"database/migrations/2026_10_01_000030_byte_exact_uuid_guards.php":{"old":"0f0fc0f306aebf987688d15d01eb07e0cdea1a211d8349e4f07b38b137e8cac4","formatted":"0226ca92999797ebe55cf510d5bcc01298c103a6e459abd90f00479cd67a4fbf","snapshot":"previous-2026_10_01_000030_byte_exact_uuid_guards.php"},"tests/Feature/HashByteGuardMigrationTest.php":{"old":"dc9c45b065dfbd14c21866fe48aaa93604f9035afbf58edb02a9a7314ca64fbb","formatted":"08f894513cfc983e435a2d60a95af62e9ec16c01de8f9f5855fc1e698086bfe5","snapshot":"previous-HashByteGuardMigrationTest.php"},"tests/Feature/UuidByteGuardMigrationTest.php":{"old":"162d6f8aef4e4078e9bb363e26c6885140f7563d7ce6fcddd3db1671c67ec1e0","formatted":"d3f18974016e814b00545e5aa89440bddd764da3e09ae8ebd7d018c932bb97d4","snapshot":"previous-UuidByteGuardMigrationTest.php"}}
          expected = {('M', path) for path in hashes} | {
              ('D', '.github/workflows/byte-guard-rollback-proof.yml'),
              ('A', '.github/workflows/byte-guard-format-proof.yml'),
          }
          actual = {tuple(line.split('\t')) for line in subprocess.check_output(
              ['git', 'diff', '--no-renames', '--name-status', 'HEAD^', 'HEAD'], text=True).splitlines()}
          if actual != expected:
              raise SystemExit('Unexpected byte guard formatting source delta.')
          for path, record in hashes.items():
              old = subprocess.check_output(['git', 'show', 'HEAD^:' + path])
              current = pathlib.Path(path).read_bytes()
              if hashlib.sha256(old).hexdigest() != record['old'] or hashlib.sha256(current).hexdigest() != record['formatted']:
                  raise SystemExit('Unexpected actual old/current byte guard source.')
              pathlib.Path('byte-guard-format-evidence', record['snapshot']).write_bytes(old)
          # This data is the original artifact 11154743846 formatter diff, never executable code.
          patch = base64.b64decode('', validate=True)
          if hashlib.sha256(patch).hexdigest() != '5a4980a8337eefbfc48989be1f90c952c4842d28296e7ea371323cddabe11c2b':
              raise SystemExit('Unexpected original formatter patch.')
          pathlib.Path('byte-guard-format-evidence/original-pint.patch').write_bytes(patch)
          manifest = {}
          current_path = None
          hunk = None
          old_remaining = new_remaining = 0
          count = 0
          for line in patch.decode().splitlines(keepends=True):
              if line.startswith('diff --git '):
                  if old_remaining or new_remaining:
                      raise SystemExit('Incomplete original formatter hunk.')
                  current_path = line.split(' a/', 1)[1].split(' b/', 1)[0].strip()
                  if current_path not in hashes or current_path in manifest:
                      raise SystemExit('Unexpected original formatter path.')
                  manifest[current_path] = []
                  hunk = None
              elif line.startswith('@@ '):
                  if old_remaining or new_remaining:
                      raise SystemExit('Incomplete original formatter hunk.')
                  match = re.fullmatch(r'@@ -(\d+),(\d+) \+(\d+),(\d+) @@\n', line)
                  if current_path is None or match is None:
                      raise SystemExit('Unexpected original formatter hunk header.')
                  old_remaining, new_remaining = int(match[2]), int(match[4])
                  hunk = {'old': '', 'formatted': ''}
                  manifest[current_path].append(hunk)
                  count += 1
              elif hunk is not None and line[:1] in (' ', '-', '+'):
                  if line[:1] != '+':
                      hunk['old'] += line[1:]
                      old_remaining -= 1
                  if line[:1] != '-':
                      hunk['formatted'] += line[1:]
                      new_remaining -= 1
                  if old_remaining < 0 or new_remaining < 0:
                      raise SystemExit('Original formatter hunk exceeds its declared byte lines.')
              elif not line.startswith(('--- ', '+++ ')):
                  raise SystemExit('Unexpected original formatter data.')
          if old_remaining or new_remaining or set(manifest) != set(hashes) or count != 28:
              raise SystemExit('Original formatter diff does not contain the exact four-path/28-hunk correction.')
          pathlib.Path('byte-guard-format-evidence/source-hashes.json').write_text(json.dumps(hashes, indent=2, sort_keys=True) + '\n')
          pathlib.Path('byte-guard-format-evidence/inverse-hunks.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          print(json.dumps({'reviewedPermanentCommit': 'f5346209a63d8ae50a889181a7dc7b8eb91e5eb4',
              'reviewedPermanentTree': '0a48b3471a5d58bcb208bec67e6886a4875be878',
              'originalFormatterArtifact': 11154743846, 'originalFormatterPatchSha256': '5a4980a8337eefbfc48989be1f90c952c4842d28296e7ea371323cddabe11c2b',
              'originalFormatterHunks': count, 'oldCurrentHashes': hashes}, sort_keys=True))
          PYTHON
          {
            git rev-parse HEAD HEAD^{tree} HEAD^ HEAD^^{tree}
            sha256sum .github/workflows/byte-guard-format-proof.yml composer.json composer.lock phpunit.xml scripts/ci/database-sqlite-skips.json database/migrations/2026_10_01_000029_byte_exact_hash_guards.php database/migrations/2026_10_01_000030_byte_exact_uuid_guards.php tests/Feature/HashByteGuardMigrationTest.php tests/Feature/UuidByteGuardMigrationTest.php tests/Support/FinalizationDatabaseMigrations.php tests/Support/DeliveryFixtures.php tests/Support/ContractFixtures.php tests/Support/PaymentFixtures.php
          } 2>&1 | tee byte-guard-format-evidence/source.log
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, bcmath, gd, zip, curl, posix
          coverage: none
          tools: composer:v2
      - name: Install only the locked backend dependencies
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist 2>&1 | tee byte-guard-format-evidence/composer-install.log
      - name: Prepare the isolated application environment
        run: |
          set -euo pipefail
          {
            cp .env.example .env
            php artisan key:generate
          } 2>&1 | tee byte-guard-format-evidence/application-setup.log
      - name: Check actual PHP syntax and complete byte/token inverses for all four paths
        run: |
          set -euo pipefail
          {
            php --version
            composer --version
          } 2>&1 | tee byte-guard-format-evidence/runtime.log
          {
            php --syntax-check database/migrations/2026_10_01_000029_byte_exact_hash_guards.php
            php --syntax-check database/migrations/2026_10_01_000030_byte_exact_uuid_guards.php
            php --syntax-check tests/Feature/HashByteGuardMigrationTest.php
            php --syntax-check tests/Feature/UuidByteGuardMigrationTest.php
          } 2>&1 | tee byte-guard-format-evidence/syntax.log
          php <<'PHP' 2>&1 | tee byte-guard-format-evidence/token-byte-bridge.log
          <?php
          function strictTokens(string $source): array
          {
              $result = [];
              foreach (token_get_all($source, TOKEN_PARSE) as $token) {
                  if (is_array($token)) {
                      if ($token[0] === T_WHITESPACE) {
                          continue;
                      }
                      $result[] = [$token[0], $token[1]];
                  } else {
                      $result[] = $token;
                  }
              }
              return $result;
          }
          $hashes = json_decode(file_get_contents('byte-guard-format-evidence/source-hashes.json'), true, flags: JSON_THROW_ON_ERROR);
          $hunks = json_decode(file_get_contents('byte-guard-format-evidence/inverse-hunks.json'), true, flags: JSON_THROW_ON_ERROR);
          if (count($hashes) !== 4 || array_keys($hashes) !== array_keys($hunks)) {
              throw new RuntimeException('Unexpected fixed formatter bridge paths.');
          }
          $records = [];
          $totalHunks = 0;
          foreach ($hashes as $path => $record) {
              $old = file_get_contents('byte-guard-format-evidence/'.$record['snapshot']);
              $current = file_get_contents($path);
              if (hash('sha256', $old) !== $record['old'] || hash('sha256', $current) !== $record['formatted']) {
                  throw new RuntimeException('Unexpected old/current formatter bridge source.');
              }
              $inverse = $current;
              foreach ($hunks[$path] as $hunk) {
                  if ($hunk['formatted'] === '' || substr_count($inverse, $hunk['formatted']) !== 1) {
                      throw new RuntimeException('The exact formatter inverse has an ambiguous hunk.');
                  }
                  $inverse = str_replace($hunk['formatted'], $hunk['old'], $inverse, $count);
                  if ($count !== 1) {
                      throw new RuntimeException('The exact formatter inverse did not replace one complete hunk.');
                  }
                  $totalHunks++;
              }
              if ($inverse !== $old) {
                  throw new RuntimeException('The complete formatter inverse differs from the actual tested parent bytes.');
              }
              $tokens = strictTokens($old);
              if (strictTokens($current) !== $tokens || strictTokens($inverse) !== $tokens) {
                  throw new RuntimeException('The formatter changed a non-whitespace token, literal or comment.');
              }
              $records[$path] = ['oldSha256' => hash('sha256', $old), 'currentSha256' => hash('sha256', $current),
                  'exactWholeFileInverseEqual' => true, 'nonWhitespaceTokensEqual' => true,
                  'originalTokenCount' => count($tokens), 'inverseHunks' => count($hunks[$path])];
          }
          if ($totalHunks !== 28) {
              throw new RuntimeException('The exact formatter bridge omitted an original hunk.');
          }
          echo json_encode(['originalFormatterHunks' => $totalHunks, 'paths' => $records], JSON_THROW_ON_ERROR), PHP_EOL;
          PHP
      - name: Verify only the four reviewed PHP formatting paths
        run: |
          set -euo pipefail
          php vendor/bin/pint --test -v database/migrations/2026_10_01_000029_byte_exact_hash_guards.php database/migrations/2026_10_01_000030_byte_exact_uuid_guards.php tests/Feature/HashByteGuardMigrationTest.php tests/Feature/UuidByteGuardMigrationTest.php \
            2>&1 | tee byte-guard-format-evidence/pint.log
      - name: Retain complete original source, inverse, syntax, token and formatting evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: byte-guard-format-${{ github.run_id }}-${{ github.run_attempt }}
          path: byte-guard-format-evidence/
          retention-days: 7
          if-no-files-found: error
          overwrite: false
