version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # One PR for compatible updates avoids a rebase-and-preflight cascade; majors stay separate for review.
    groups:
      composer-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Runtime is Node 24; a types-major upgrade belongs with a reviewed runtime upgrade.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
        # Exact pins are reviewed one at a time: Playwright must match the pinned WebKit backport
        # (scripts/ci/apply-playwright-webkit-offline-backport.mjs), so a bump would fail the whole group.
        exclude-patterns: ["@playwright/test", "playwright", "playwright-core", "vitest", "typescript", "jsdom"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
