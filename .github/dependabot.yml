version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # One PR for compatible updates avoids a rebase-and-preflight cascade; majors stay separate for review.
    groups:
      composer-minor-patch:
        update-types: ["minor", "patch"]
        # The PDF libraries render frozen contract PDFs and fonts, so each bump needs its own compatibility evidence. The wildcard
        # also covers the transitive renderers (barcode, color, file, unicode and the other tc-lib-pdf-* parts) that
        # resources/contracts/*/profile-assets.json pin, so each of them gets its own PR too.
        exclude-patterns: ["tecnickcom/tc-lib-*"]
    ignore:
      # stripe-php 22 pins API 2026-09-30.endive or later, which removes payment_method_types from Checkout Session
      # create: the BL-68 payment-method allowlist (CheckoutPaymentMethods) and its stored-request replay depend on it.
      # Moving needs a designed payment-method migration, not a version bump (decision 2026-11-14, Dependabot #376).
      - dependency-name: "stripe/stripe-php"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Runtime is Node 24; a types-major upgrade belongs with a reviewed runtime upgrade.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
        # Exact pins are reviewed one at a time: test-runner and type-checker majors change behaviour the group would hide.
        exclude-patterns: ["@playwright/test", "playwright", "playwright-core", "vitest", "typescript", "jsdom", "@testing-library/dom", "@testing-library/jest-dom"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
